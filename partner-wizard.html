<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Leazo – Order Task</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body{background:#f3f4f6;font-family:sans-serif;}
  .dot{width:8px;height:8px;border-radius:50%;background:#d1d5db;display:inline-block;}
  .dot.done{background:#22c55e;}
  .dot.active{background:#facc15;width:11px;height:11px;}
  .btn-primary{width:100%;background:#facc15;border-bottom:4px solid #ca8a04;color:#000;font-weight:700;padding:14px;border-radius:14px;font-size:15px;cursor:pointer;}
  .btn-primary:disabled{background:#e5e7eb;border-color:#d1d5db;color:#9ca3af;cursor:not-allowed;}
  .btn-secondary{width:100%;background:#fff;border:2px solid #e5e7eb;color:#374151;font-weight:600;padding:12px;border-radius:14px;font-size:14px;cursor:pointer;}
  .btn-danger{width:100%;background:#fef2f2;border:2px solid #fca5a5;color:#dc2626;font-weight:600;padding:12px;border-radius:14px;cursor:pointer;}
  .btn-green{width:100%;background:#22c55e;color:#fff;font-weight:700;padding:14px;border-radius:14px;font-size:15px;cursor:pointer;}
  .btn-green:disabled{background:#e5e7eb;color:#9ca3af;cursor:not-allowed;}
  .card{background:#f9fafb;border-radius:14px;padding:16px;margin-bottom:16px;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;z-index:999;max-width:320px;text-align:center;opacity:0;transition:opacity .3s;}
  .toast.show{opacity:1;}
  input[type=file]{width:100%;border:2px dashed #d1d5db;border-radius:12px;padding:10px;font-size:14px;margin-bottom:12px;background:#fff;}
  label.field{display:block;font-size:12px;color:#9ca3af;margin-bottom:4px;font-weight:600;}
  .info-box{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:12px;font-size:13px;margin-bottom:14px;}
  .checkbox-row{display:flex;align-items:center;gap:10px;font-size:14px;margin-bottom:14px;padding:12px;background:#f9fafb;border-radius:10px;}
  .checkbox-row input{width:20px;height:20px;cursor:pointer;}
</style>
</head>
<body class="pb-24">

<div class="max-w-md mx-auto min-h-screen bg-white">

  <!-- Top bar -->
  <div class="bg-yellow-400 border-b-4 border-blue-600 px-4 py-3 flex justify-between items-center sticky top-0 z-10">
    <button onclick="goBack()" class="text-sm font-bold px-2 py-1">← Back</button>
    <span class="text-base font-black italic tracking-widest">LEAZO</span>
    <span id="refBadge" class="text-xs font-bold bg-black text-white px-2 py-1 rounded-full">—</span>
  </div>

  <!-- Loading -->
  <div id="loadingScreen" class="text-center py-20 text-gray-400">
    <div class="text-3xl mb-3">⏳</div>Loading order...
  </div>

  <!-- Error -->
  <div id="errorScreen" class="hidden px-6 py-20 text-center">
    <div class="text-4xl mb-4">⚠️</div>
    <p id="errorMsg" class="text-gray-600 mb-6"></p>
    <button onclick="goBack()" class="btn-secondary" style="width:auto;padding:10px 24px;">Go Back</button>
  </div>

  <!-- Wizard -->
  <div id="wizardScreen" class="hidden">

    <!-- Progress -->
    <div class="px-4 pt-4 pb-1">
      <div class="flex items-center gap-1.5 justify-center mb-1" id="progressDots"></div>
      <p id="stepLabel" class="text-center text-xs text-gray-400"></p>
    </div>

    <!-- Order info bar -->
    <div class="mx-4 mt-3 mb-4 bg-gray-50 rounded-2xl p-3 flex gap-3 text-sm">
      <div class="flex-1">
        <p class="font-bold text-gray-900" id="infoName"></p>
        <p class="text-gray-400 text-xs" id="infoAddress"></p>
      </div>
      <div class="text-right">
        <p class="font-bold text-green-700" id="infoAmount"></p>
        <p class="text-xs" id="infoPayType"></p>
      </div>
    </div>

    <!-- Step content -->
    <div id="stepBody" class="px-4"></div>
  </div>

  <!-- Done -->
  <div id="doneScreen" class="hidden px-6 py-20 text-center">
    <div class="text-6xl mb-4" id="doneIcon">✅</div>
    <p class="text-2xl font-black text-gray-900 mb-2" id="doneTitle"></p>
    <p class="text-gray-500 mb-8" id="doneMsg"></p>
    <button onclick="goBack()" class="btn-primary" style="max-width:200px;margin:0 auto;">Back to Orders</button>
  </div>

</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<script>
// ─── CONFIG ───────────────────────────────────────────────────
const SUPABASE_URL  = 'https://rohybhpktpfmeashdlzz.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJvaHliaHBrdHBmbWVhc2hkbHp6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MzcwMTYsImV4cCI6MjA5MzMxMzAxNn0.NhM9DnXOl_7h3NHh1r78cPNvbogO_qOEhPfQauyKHJE';
const BUCKET       = 'partner-uploads';
const db           = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

// ─── STATUS ORDER (used to find which step comes next) ────────
// The position in these arrays determines progression order.
// Delivery phase statuses in order:
const DELIVERY_ORDER = [
  'assigned','accepted','packed_scanned','out_for_delivery','reached_customer',
  'id_verified','items_verified_delivery','bundle_photo_done','condition_ack_delivery',
  'otp_verified_delivery','payment_collected','delivered'
];
// Return phase statuses in order:
const RETURN_ORDER = [
  'out_for_pickup','reached_pickup','items_verified_return',
  'condition_photo_return','otp_verified_return','completed'
];
// These statuses mean we are in return phase:
const RETURN_PHASE = new Set([
  'delivered','active_rental','return_window_open','out_for_pickup','reached_pickup',
  'items_verified_return','condition_photo_return','dispute_flagged','otp_verified_return',
  'completed','rated'
]);

// ─── STATE ────────────────────────────────────────────────────
const bookingId = new URLSearchParams(location.search).get('booking_id');
let partner  = null;
let booking  = null;
let cfg      = null;
let assets   = [];
let steps    = [];   // active step list, rebuilt each time
let stepIdx  = 0;    // which step to show

// ─── BOOT ─────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {
  const pid = sessionStorage.getItem('partner_id');
  const pin = sessionStorage.getItem('partner_pin');
  if (!pid || !pin) { location.href = 'partner-task.html'; return; }

  const { data: p } = await db.from('partners').select('*').eq('id', pid).eq('pin', pin).maybeSingle();
  if (!p || p.status !== 'active') { sessionStorage.clear(); location.href = 'partner-task.html'; return; }
  partner = p;

  if (!bookingId) { showError('No booking ID specified.'); return; }
  await loadBooking();
});

function goBack() { location.href = 'partner-task.html'; }

// ─── LOAD ─────────────────────────────────────────────────────
async function loadBooking() {
  try {
    const { data: b, error: bErr } = await db.from('bookings').select('*').eq('id', bookingId).maybeSingle();
    if (bErr || !b) { showError('Order not found. It may have been reassigned.'); return; }
    if (String(b.assigned_partner_id) !== String(partner.id)) { showError('This order is not assigned to you.'); return; }
    booking = b;

    const { data: c } = await db.from('booking_effective_config').select('*').eq('booking_id', bookingId).maybeSingle();
    cfg = c || { scan_required: false, installation_included: true, id_verification_required: false, bundle_photo_count: 1, is_delivery_only: false };

    if (cfg.scan_required) {
      const { data: a } = await db.from('partner_assets').select('*').eq('partner_id', partner.id).eq('is_high_value', true);
      assets = a || [];
    }

    populateInfoBar();
    buildSteps();
    stepIdx = findFirstPendingStep();
    show('wizardScreen');
    hide('loadingScreen');
    renderStep();
  } catch (e) {
    console.error(e);
    showError('Failed to load order. Check your connection.');
  }
}

// ─── INFO BAR ─────────────────────────────────────────────────
function populateInfoBar() {
  document.getElementById('refBadge').textContent  = booking.reference_number || ('#' + booking.id);
  document.getElementById('infoName').textContent   = booking.customer_name   || 'Customer';
  document.getElementById('infoAddress').textContent= booking.address         || '—';
  document.getElementById('infoAmount').textContent = '₹' + (booking.total_amount || 0);
  const paid = (booking.payment_status === 'paid');
  const pm   = document.getElementById('infoPayType');
  pm.textContent  = paid ? 'Prepaid ✅' : 'COD – collect cash';
  pm.style.color  = paid ? '#16a34a' : '#dc2626';
}

// ─── BUILD STEP LIST ──────────────────────────────────────────
// Each step: { id, label, produces_status, render }
// produces_status = what DB status this step sets on completion
function buildSteps() {
  const inReturn = RETURN_PHASE.has(booking.fulfillment_status);

  if (!inReturn) {
    // ── DELIVERY STEPS ──
    const s = [];
    s.push({ id:'accept',       label:'Accept Order',        produces_status:'accepted',               render: stepAccept });
    if (cfg.scan_required)
    s.push({ id:'pack_scan',    label:'Pack & Scan',         produces_status:'packed_scanned',          render: () => stepScan('pack','packed_scanned') });
    s.push({ id:'out_deliver',  label:'Out for Delivery',    produces_status:'out_for_delivery',        render: () => stepSimple('out_for_delivery','🛵  Start Delivery','Tap when you leave. Customer will be notified on WhatsApp.') });
    s.push({ id:'reached',      label:'Reached Customer',    produces_status:'reached_customer',        render: () => stepSimple('reached_customer','📍  Mark Reached','Tap when you arrive at the customer location.',true) });
    if (cfg.id_verification_required)
    s.push({ id:'id_verify',    label:'ID Verification',     produces_status:'id_verified',             render: stepIdVerify });
    if (cfg.scan_required)
    s.push({ id:'scan_deliver', label:'Scan Items',          produces_status:'items_verified_delivery', render: () => stepScan('delivery','items_verified_delivery') });
    s.push({ id:'photos',       label: cfg.installation_included ? 'Installation Photo' : 'Package Photo', produces_status:'bundle_photo_done', render: stepBundlePhoto });
    s.push({ id:'condition',    label:'Condition Photo',     produces_status:'condition_ack_delivery',  render: stepConditionPhoto });
    s.push({ id:'otp_del',      label:'Customer OTP',        produces_status:'otp_verified_delivery',   render: () => stepOtp('delivery') });
    if (booking.payment_status !== 'paid')
    s.push({ id:'payment',      label:'Collect Payment',     produces_status:'payment_collected',       render: stepPayment });
    s.push({ id:'done_del',     label:'Delivered',           produces_status:'delivered',               render: () => stepSimple('delivered','✅  Confirm Delivered','All steps complete. Mark the order as delivered.') });
    steps = s;
  } else {
    // ── RETURN STEPS ──
    const s = [];
    s.push({ id:'out_pickup',   label:'Out for Pickup',      produces_status:'out_for_pickup',         render: () => stepSimple('out_for_pickup','🛵  Start Pickup','Tap when you leave for pickup. Customer will be notified.') });
    s.push({ id:'reach_pick',   label:'Reached Customer',    produces_status:'reached_pickup',         render: () => stepSimple('reached_pickup','📍  Mark Reached','Tap when you arrive at the customer location.',true) });
    if (cfg.scan_required)
    s.push({ id:'scan_ret',     label:'Scan Items',          produces_status:'items_verified_return',  render: () => stepScan('return_customer','items_verified_return') });
    s.push({ id:'cond_ret',     label:'Condition Check',     produces_status:'condition_photo_return', render: stepReturnCondition });
    s.push({ id:'otp_ret',      label:'Return OTP',          produces_status:'otp_verified_return',    render: () => stepOtp('return') });
    if (cfg.scan_required)
    s.push({ id:'stock',        label:'Back to Stock',       produces_status:'completed',              render: () => stepScan('return_partner','completed') });
    else
    s.push({ id:'done_ret',     label:'Complete',            produces_status:'completed',              render: () => stepSimple('completed','✅  Mark Completed','Confirm the rental is fully closed.') });
    steps = s;
  }
}

// ─── FIND WHICH STEP TO SHOW ──────────────────────────────────
// Uses STATUS_ORDER to compare positions — immune to step list rebuilds.
function findFirstPendingStep() {
  const inReturn = RETURN_PHASE.has(booking.fulfillment_status);
  const order    = inReturn ? RETURN_ORDER : DELIVERY_ORDER;
  const curPos   = order.indexOf(booking.fulfillment_status); // -1 if not yet started

  for (let i = 0; i < steps.length; i++) {
    const stepPos = order.indexOf(steps[i].produces_status);
    // Show the first step whose produced status is AFTER the current status in order
    if (stepPos > curPos) return i;
  }
  // All steps done — show last step
  return steps.length - 1;
}

// ─── RENDER CURRENT STEP ──────────────────────────────────────
function renderStep() {
  // Progress dots
  document.getElementById('progressDots').innerHTML = steps.map((s, i) => {
    const cls = i < stepIdx ? 'done' : (i === stepIdx ? 'active' : '');
    return `<span class="dot ${cls}"></span>`;
  }).join('');
  document.getElementById('stepLabel').textContent =
    `Step ${stepIdx + 1} of ${steps.length} — ${steps[stepIdx].label}`;
  document.getElementById('stepBody').innerHTML = '';
  try {
    steps[stepIdx].render();
  } catch(e) {
    console.error('Render error:', e);
    document.getElementById('stepBody').innerHTML =
      `<div class="card text-red-500 text-sm">Something went wrong rendering this step. Please go back and try again.<br><small>${e.message}</small></div>`;
  }
}

// ─── ADVANCE TO NEXT STEP ─────────────────────────────────────
async function advance(newStatus, extraFields) {
  try {
    const payload = { fulfillment_status: newStatus, ...(extraFields || {}) };
    const { error } = await db.from('bookings').update(payload).eq('id', booking.id);
    if (error) throw error;

    // Update local booking object
    Object.assign(booking, payload);

    // Log the event (non-blocking — don't let logging failure block the wizard)
    logEvent(newStatus).catch(e => console.warn('logEvent failed (non-blocking):', e));

    // Special completion screens
    if (newStatus === 'delivered') {
      showDone('🎉', 'Delivery Complete!', 'Great job! The order is now active.');
      return;
    }
    if (newStatus === 'completed') {
      showDone('✅', 'Return Complete!', 'Rental closed. Well done!');
      return;
    }

    // Rebuild step list (phase may have changed) and find next step
    buildSteps();
    stepIdx = findFirstPendingStep();
    renderStep();
    window.scrollTo(0, 0);
  } catch(e) {
    console.error('advance() error:', e);
    toast('❌ Save failed: ' + (e.message || 'Check connection'), 4000);
    // Re-enable any disabled buttons
    document.querySelectorAll('button:disabled').forEach(b => b.disabled = false);
  }
}

// ─── STEP RENDERERS ───────────────────────────────────────────

// ACCEPT
function stepAccept() {
  const d = booking;
  el('stepBody').innerHTML = `
    <div class="card">
      <p class="text-xs text-gray-400 mb-3 font-semibold uppercase tracking-wide">Order Details</p>
      <div class="space-y-2 text-sm">
        <row><b>Customer:</b> ${d.customer_name || '—'}</row>
        <div><b>Phone:</b> ${d.phone || '—'}</div>
        <div><b>Address:</b> ${d.address || '—'}</div>
        <div><b>Date:</b> ${d.booking_date || '—'} &nbsp; ${d.start_time || ''} – ${d.end_time || ''}</div>
        <div><b>Plan:</b> ${d.plan || '—'}</div>
        <div><b>Amount:</b> <span class="text-green-700 font-bold">₹${d.total_amount || 0}</span> &nbsp; ${d.payment_status === 'paid' ? '(Prepaid ✅)' : '(COD – collect from customer)'}</div>
      </div>
    </div>
    <button class="btn-primary mb-3" onclick="doAccept()">Accept Order</button>
    <button class="btn-danger" onclick="doReject()">Reject Order</button>`;
}

async function doAccept() {
  setBusy(true, 'Accepting...');
  await advance('accepted');
  setBusy(false);
}

async function doReject() {
  if (!confirm('Reject this order? Admin will be notified to reassign.')) return;
  setBusy(true, 'Rejecting...');
  try {
    await db.from('bookings').update({ fulfillment_status: 'rejected', assigned_partner_id: null }).eq('id', booking.id);
    logEvent('rejected').then(()=>{}).catch(()=>{});
    toast('Order rejected. Admin notified.');
    setTimeout(() => goBack(), 1500);
  } catch(e) { toast('Failed to reject. Try again.', 3000); setBusy(false); }
}

// SIMPLE ACTION (out_for_delivery, reached, out_for_pickup, etc)
function stepSimple(nextStatus, btnLabel, desc, captureGeo) {
  el('stepBody').innerHTML = `
    <div class="info-box">${desc}</div>
    <button class="btn-primary" id="simpleBtn" onclick="doSimple('${nextStatus}', ${!!captureGeo})">${btnLabel}</button>`;
}

async function doSimple(nextStatus, withGeo) {
  const btn = el('simpleBtn');
  btn.disabled = true;
  btn.textContent = 'Please wait...';

  // Notify customer on key events (fire-and-forget)
  if (nextStatus === 'out_for_delivery') notifyWA('out_for_delivery');
  if (nextStatus === 'out_for_pickup')   notifyWA('out_for_pickup');

  let geo = null;
  if (withGeo) geo = await getGeo();

  await advance(nextStatus, geo ? { last_partner_lat: geo.lat, last_partner_lng: geo.lng } : {});
}

// PACK/DELIVERY/RETURN SCAN
function stepScan(scanPoint, nextStatus) {
  if (!assets.length) {
    el('stepBody').innerHTML = `
      <div class="info-box">No high-value assets registered for your account yet. Ask admin to add assets.</div>
      <button class="btn-primary" onclick="advance('${nextStatus}')">Skip & Continue</button>`;
    return;
  }
  el('stepBody').innerHTML = `
    <p class="text-sm text-gray-500 mb-3">Tap each item to confirm it's present and accounted for.</p>
    <div id="assetList" class="space-y-2 mb-5">
      ${assets.map(a => `
        <button type="button" data-id="${a.id}" data-checked="0" onclick="toggleAsset(this)"
          class="w-full flex items-center justify-between border-2 rounded-xl px-4 py-3 text-left transition-all">
          <div>
            <p class="font-semibold">${a.asset_label || a.asset_type}</p>
            <p class="text-xs text-gray-400">${a.serial_number ? 'S/N: ' + a.serial_number : ''}</p>
          </div>
          <span class="check text-2xl text-gray-300">○</span>
        </button>`).join('')}
    </div>
    <button id="scanBtn" class="btn-green" disabled onclick="doScan('${scanPoint}','${nextStatus}')">Confirm All Present</button>`;
}

function toggleAsset(btn) {
  const on = btn.dataset.checked === '1';
  btn.dataset.checked = on ? '0' : '1';
  btn.querySelector('.check').textContent = on ? '○' : '✅';
  btn.style.borderColor = on ? '' : '#22c55e';
  btn.style.background  = on ? '' : '#f0fdf4';
  const all = [...document.querySelectorAll('#assetList button')];
  const done = all.every(b => b.dataset.checked === '1');
  const scanBtn = el('scanBtn');
  scanBtn.disabled = !done;
}

async function doScan(scanPoint, nextStatus) {
  el('scanBtn').disabled = true;
  el('scanBtn').textContent = 'Saving...';
  try {
    const geo = await getGeo();
    const rows = assets.map(a => ({
      booking_id: booking.id, asset_id: a.id, scan_point: scanPoint,
      scanned_by: partner.phone,
      geo_lat: geo ? geo.lat : null, geo_lng: geo ? geo.lng : null
    }));
    const { error } = await db.from('asset_scans').insert(rows);
    if (error) throw error;
    await advance(nextStatus);
  } catch(e) { toast('Scan save failed: ' + e.message, 4000); el('scanBtn').disabled = false; el('scanBtn').textContent = 'Confirm All Present'; }
}

// ID VERIFICATION
function stepIdVerify() {
  el('stepBody').innerHTML = `
    <div class="info-box">Take a live photo of the customer's Aadhaar card and a photo of their signature. Stored privately, auto-deleted after 90 days.</div>
    <label class="field">Aadhaar / ID Photo (live camera only)</label>
    <input type="file" accept="image/*" capture="environment" id="idFile"/>
    <label class="field">Signature Photo</label>
    <input type="file" accept="image/*" capture="environment" id="sigFile"/>
    <button class="btn-primary" onclick="doIdVerify()">Submit & Continue</button>`;
}

async function doIdVerify() {
  const idFile  = el('idFile').files[0];
  const sigFile = el('sigFile').files[0];
  if (!idFile || !sigFile) { toast('Both photos are required.', 3000); return; }
  setBusy(true, 'Uploading...');
  try {
    const geo    = await getGeo();
    const idUrl  = await uploadPhoto(idFile,  'id-verification');
    const sigUrl = await uploadPhoto(sigFile, 'signatures');
    await db.from('customer_verifications').insert({
      booking_id: booking.id, id_photo_url: idUrl, signature_url: sigUrl,
      captured_geo_lat: geo ? geo.lat : null, captured_geo_lng: geo ? geo.lng : null
    });
    await advance('id_verified');
  } catch(e) { toast('Upload failed: ' + e.message, 4000); }
  setBusy(false);
}

// BUNDLE / INSTALLATION / PACKAGE PHOTO
function stepBundlePhoto() {
  const isInstall = cfg.installation_included;
  el('stepBody').innerHTML = `
    <div class="info-box">
      ${isInstall
        ? 'Take a photo showing the PS5 installed and all accessories visible (controllers, cables, charging dock).'
        : 'Take a photo of the open package showing all items included.'}
      <br><br>You can add extra photos if needed.
    </div>
    <div id="photoList"></div>
    <label class="field">Photo (live camera only)</label>
    <input type="file" accept="image/*" capture="environment" id="bundleFile" onchange="previewBundle(this)"/>
    <button class="btn-secondary mb-3" style="margin-top:4px" onclick="addMorePhoto()">+ Add Another Photo</button>
    <button class="btn-primary" id="bundleBtn" onclick="doBundlePhoto()">Submit & Continue</button>`;
  window._bundlePhotos = [];
}

function previewBundle(input) {
  if (!input.files[0]) return;
  window._bundlePhotos.push(input.files[0]);
  const list = el('photoList');
  list.innerHTML += `<div class="flex items-center gap-2 mb-2 text-sm text-green-700">✅ Photo ${window._bundlePhotos.length} added</div>`;
}

function addMorePhoto() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*'; input.capture = 'environment';
  input.style.display = 'none';
  input.onchange = () => previewBundle(input);
  document.body.appendChild(input);
  input.click();
}

async function doBundlePhoto() {
  if (!window._bundlePhotos.length && !el('bundleFile').files[0]) { toast('At least one photo required.', 3000); return; }
  const allFiles = [...(el('bundleFile').files[0] ? [el('bundleFile').files[0]] : [])];
  // merge any extra added photos
  if (window._bundlePhotos.length) {
    window._bundlePhotos.forEach(f => { if (!allFiles.includes(f)) allFiles.push(f); });
  }
  el('bundleBtn').disabled = true; el('bundleBtn').textContent = 'Uploading...';
  try {
    const urls = [];
    for (const f of allFiles) urls.push(await uploadPhoto(f, 'bundle-photos'));
    logEvent('bundle_photo_done', { photo_url: urls[0], metadata: { all_urls: urls } }).then(()=>{}).catch(()=>{});
    await advance('bundle_photo_done');
  } catch(e) { toast('Upload failed: ' + e.message, 4000); el('bundleBtn').disabled = false; el('bundleBtn').textContent = 'Submit & Continue'; }
}

// CONDITION PHOTO (delivery)
function stepConditionPhoto() {
  el('stepBody').innerHTML = `
    <div class="info-box">Take a clear photo of the PS5 and accessories showing their current condition. This is used as evidence if any damage is disputed later.</div>
    <label class="field">Condition Photo (live camera only)</label>
    <input type="file" accept="image/*" capture="environment" id="condFile"/>
    <button class="btn-primary" id="condBtn" onclick="doConditionPhoto()">Submit & Continue</button>`;
}

async function doConditionPhoto() {
  const file = el('condFile').files[0];
  if (!file) { toast('Photo required.', 3000); return; }
  el('condBtn').disabled = true; el('condBtn').textContent = 'Uploading...';
  try {
    const url = await uploadPhoto(file, 'condition-photos');
    window._deliveryConditionUrl = url;
    logEvent('condition_photo_delivery', { photo_url: url }).then(()=>{}).catch(()=>{});
    await advance('condition_ack_delivery');
  } catch(e) { toast('Upload failed: ' + e.message, 4000); el('condBtn').disabled = false; el('condBtn').textContent = 'Submit & Continue'; }
}

// RETURN CONDITION (partner assesses)
function stepReturnCondition() {
  el('stepBody').innerHTML = `
    <div class="info-box">Inspect the PS5 and accessories being returned. Take a photo of their condition.</div>
    <label class="field">Return Condition Photo (live camera only)</label>
    <input type="file" accept="image/*" capture="environment" id="retCondFile"/>
    <div class="checkbox-row" style="margin-top:12px">
      <input type="checkbox" id="damageFlag" onchange="el('damageBox').classList.toggle('hidden',!this.checked)"/>
      <label for="damageFlag">Damage or missing item found</label>
    </div>
    <textarea id="damageBox" placeholder="Describe the damage or missing item..." class="hidden w-full border-2 rounded-xl px-3 py-2 mb-3 text-sm" rows="3"></textarea>
    <button class="btn-primary" id="retCondBtn" onclick="doReturnCondition()">Submit & Continue</button>`;
}

async function doReturnCondition() {
  const file    = el('retCondFile').files[0];
  if (!file) { toast('Photo required.', 3000); return; }
  const damaged = el('damageFlag').checked;
  const notes   = el('damageBox') ? el('damageBox').value.trim() : '';
  if (damaged && !notes) { toast('Please describe the damage.', 3000); return; }
  el('retCondBtn').disabled = true; el('retCondBtn').textContent = 'Uploading...';
  try {
    const url = await uploadPhoto(file, 'return-condition');
    await db.from('condition_acknowledgements').insert({
      booking_id: booking.id, stage: 'return', acknowledged_by: 'partner',
      agreed: !damaged, dispute_notes: damaged ? notes : null, photo_url: url
    });
    if (damaged) {
      await db.from('disputes').insert({
        booking_id: booking.id, partner_id: partner.id,
        dispute_type: 'condition_damage', description: notes
      });
      await db.from('bookings').update({ fulfillment_status: 'dispute_flagged' }).eq('id', booking.id);
      Object.assign(booking, { fulfillment_status: 'dispute_flagged' });
      showDone('⚠️', 'Damage Flagged', 'Admin has been notified and will review before this order is closed.');
      return;
    }
    await advance('condition_photo_return');
  } catch(e) { toast('Failed: ' + e.message, 4000); el('retCondBtn').disabled = false; el('retCondBtn').textContent = 'Submit & Continue'; }
}

// OTP STEP (delivery or return)
function stepOtp(stage) {
  const isD = stage === 'delivery';
  el('stepBody').innerHTML = `
    <div class="info-box">
      <b>Ask customer to confirm verbally:</b><br>
      "${isD
        ? 'The PS5 and all accessories are in good condition. I confirm delivery.'
        : 'All items have been collected correctly.'}"
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="custAgree"/>
      <label for="custAgree">Customer has confirmed (tick after verbal confirmation)</label>
    </div>
    <button class="btn-primary mb-3" id="sendOtpBtn" onclick="doSendOtp('${stage}')">Send OTP to Customer via WhatsApp</button>
    <div class="card" style="text-align:center">
      <p class="text-xs text-gray-400 mb-2">Enter the code customer tells you</p>
      <input type="tel" id="otpInput" maxlength="4" inputmode="numeric" placeholder="_ _ _ _"
        class="text-center text-3xl font-black tracking-widest w-full border-2 rounded-xl py-3 mb-3"/>
      <button class="btn-green" id="verifyBtn" onclick="doVerifyOtp('${stage}')">Verify & Confirm</button>
    </div>
    <button class="btn-secondary mt-3" style="font-size:12px;color:#9ca3af" onclick="doOtpFallback('${stage}')">Customer can't receive OTP? Use fallback</button>`;
}

async function doSendOtp(stage) {
  if (!el('custAgree').checked) { toast('Please confirm customer agreed first.', 3000); return; }
  el('sendOtpBtn').disabled = true; el('sendOtpBtn').textContent = 'Sending...';

  // Save customer acknowledgement (non-blocking)
  try {
    await db.from('condition_acknowledgements').insert({
      booking_id: booking.id, stage, acknowledged_by: 'customer', agreed: true,
      photo_url: window._deliveryConditionUrl || null
    });
  } catch(e) { console.warn('ack insert:', e); }

  const otp = String(Math.floor(1000 + Math.random() * 9000));
  const field = stage === 'delivery' ? { delivery_otp: otp } : { return_otp: otp };
  await db.from('bookings').update(field).eq('id', booking.id);
  Object.assign(booking, field);

  try {
    const r = await fetch(`${SUPABASE_URL}/functions/v1/send-notification`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_ANON}` },
      body: JSON.stringify({ type: stage === 'delivery' ? 'delivery_otp' : 'return_otp', booking: { ...booking, otp } })
    });
    const res = await r.json();
    if (!res.success) throw new Error('WA send failed');
    toast('OTP sent to customer ✅');
  } catch(e) {
    toast(`WhatsApp failed. Read OTP to customer: ${otp}`, 6000);
  }
  el('sendOtpBtn').textContent = 'OTP Sent — Resend';
  el('sendOtpBtn').disabled = false;
}

async function doVerifyOtp(stage) {
  const entered  = (el('otpInput').value || '').trim();
  const expected = stage === 'delivery' ? booking.delivery_otp : booking.return_otp;
  if (!expected) { toast('Send the OTP first.', 3000); return; }
  if (entered !== expected) { toast('Incorrect OTP. Ask customer to check WhatsApp.', 3000); return; }
  el('verifyBtn').disabled = true; el('verifyBtn').textContent = 'Verifying...';
  const extra = stage === 'delivery' ? { delivery_otp_verified: true } : { return_otp_verified: true };
  await advance(stage === 'delivery' ? 'otp_verified_delivery' : 'otp_verified_return', extra);
}

async function doOtpFallback(stage) {
  if (!confirm('Use fallback? Your location will be logged and admin will review this confirmation.')) return;
  const geo = await getGeo();
  try {
    await logEvent((stage === 'delivery' ? 'delivery' : 'return') + '_otp_fallback', {
      geo_lat: geo ? geo.lat : null, geo_lng: geo ? geo.lng : null,
      metadata: { reason: 'customer_unreachable' }
    });
  } catch(e) { console.warn('logEvent fallback:', e); }
  const extra = stage === 'delivery' ? { delivery_otp_verified: false } : { return_otp_verified: false };
  await advance(stage === 'delivery' ? 'otp_verified_delivery' : 'otp_verified_return', extra);
  toast('Marked via fallback. Admin will review.');
}

// PAYMENT (COD)
function stepPayment() {
  el('stepBody').innerHTML = `
    <div class="info-box">Collect <b>₹${booking.total_amount || 0}</b> from the customer before handing over the PS5.</div>
    <p class="text-sm font-semibold text-gray-600 mb-3">Payment method received:</p>
    <div class="flex gap-3 mb-4">
      <button data-mode="cash" onclick="pickPayMode(this)" class="flex-1 border-2 rounded-xl py-3 font-bold text-sm">💵 Cash</button>
      <button data-mode="upi"  onclick="pickPayMode(this)" class="flex-1 border-2 rounded-xl py-3 font-bold text-sm">📱 UPI</button>
    </div>
    <button id="payBtn" class="btn-green" disabled onclick="doPayment()">Confirm Payment Collected</button>`;
}

function pickPayMode(btn) {
  document.querySelectorAll('[data-mode]').forEach(b => { b.style.borderColor=''; b.style.background=''; });
  btn.style.borderColor = '#22c55e'; btn.style.background = '#f0fdf4';
  window._payMode = btn.dataset.mode;
  el('payBtn').disabled = false;
}

async function doPayment() {
  el('payBtn').disabled = true; el('payBtn').textContent = 'Saving...';
  try {
    await db.from('payment_ledger').insert({
      booking_id: booking.id, partner_id: partner.id,
      direction: 'partner_owes_leazo',
      amount: booking.total_amount || 0,
      commission_amount: ((booking.total_amount || 0) * (partner.commission_percent || 20)) / 100,
      status: 'pending'
    });
    await advance('payment_collected', { payment_status: 'paid' });
  } catch(e) { toast('Failed: ' + e.message, 4000); el('payBtn').disabled = false; el('payBtn').textContent = 'Confirm Payment Collected'; }
}

// ─── UTILITIES ────────────────────────────────────────────────
function el(id) { return document.getElementById(id); }
function show(id) { el(id).classList.remove('hidden'); }
function hide(id) { el(id).classList.add('hidden'); }

function showDone(icon, title, msg) {
  hide('wizardScreen'); hide('loadingScreen'); hide('errorScreen');
  el('doneIcon').textContent  = icon;
  el('doneTitle').textContent = title;
  el('doneMsg').textContent   = msg;
  show('doneScreen');
}

function showError(msg) {
  hide('loadingScreen'); hide('wizardScreen');
  el('errorMsg').textContent = msg;
  show('errorScreen');
}

let toastTimer;
function toast(msg, duration) {
  const t = el('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), duration || 2500);
}

function setBusy(busy, label) {
  document.querySelectorAll('button').forEach(b => b.disabled = busy);
  if (label && busy) {
    const primary = document.querySelector('.btn-primary');
    if (primary) primary.textContent = label;
  }
}

function getGeo() {
  return new Promise(resolve => {
    if (!navigator.geolocation) { resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      p => resolve({ lat: p.coords.latitude, lng: p.coords.longitude }),
      () => resolve(null),
      { enableHighAccuracy: true, timeout: 8000 }
    );
  });
}

async function uploadPhoto(file, folder) {
  const ext  = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const path = `${folder}/${booking.id}_${Date.now()}.${ext}`;
  const { error } = await db.storage.from(BUCKET).upload(path, file, { upsert: true });
  if (error) throw new Error('Storage: ' + (error.message || JSON.stringify(error)));
  const { data } = db.storage.from(BUCKET).getPublicUrl(path);
  return data.publicUrl;
}

async function logEvent(eventType, opts) {
  opts = opts || {};
  const geo = opts.geo_lat ? null : await getGeo().catch(() => null);
  await db.from('booking_events').insert({
    booking_id:  booking.id,
    event_type:  eventType,
    actor_type: 'partner',
    actor_id:    partner.phone,
    notes:       opts.notes      || null,
    photo_url:   opts.photo_url  || null,
    geo_lat:     opts.geo_lat    || (geo ? geo.lat : null),
    geo_lng:     opts.geo_lng    || (geo ? geo.lng : null),
    metadata:    opts.metadata   || null
  });
}

async function notifyWA(type) {
  try {
    await fetch(`${SUPABASE_URL}/functions/v1/send-notification`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_ANON}` },
      body: JSON.stringify({ type, booking })
    });
  } catch(e) { console.warn('WA notify failed (non-blocking):', e); }
}
</script>
