<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<title>Leazo – Order Task</title>
<script src="https://cdn.tailwindcss.com"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&display=swap');
  html, body { background:#f3f4f6; font-family:sans-serif; overscroll-behavior:none; }
  #wizardHeader { position:fixed; top:0; left:0; right:0; z-index:50; }
  #wizardBody   { padding-top:50px; }
  .dot{width:8px;height:8px;border-radius:50%;background:#d1d5db;display:inline-block;}
  .dot.done{background:#22c55e;}
  .dot.active{background:#facc15;width:11px;height:11px;}
  .btn-primary{width:100%;background:#facc15;border-bottom:4px solid #ca8a04;color:#000;font-weight:700;padding:14px;border-radius:14px;font-size:15px;cursor:pointer;}
  .btn-primary:disabled{background:#e5e7eb;border-color:#d1d5db;color:#9ca3af;cursor:not-allowed;}
  .btn-secondary{width:100%;background:#fff;border:2px solid #e5e7eb;color:#374151;font-weight:600;padding:12px;border-radius:14px;font-size:14px;cursor:pointer;}
  .btn-danger{width:100%;background:#fef2f2;border:2px solid #fca5a5;color:#dc2626;font-weight:600;padding:12px;border-radius:14px;cursor:pointer;}
  .btn-green{width:100%;background:#22c55e;color:#fff;font-weight:700;padding:14px;border-radius:14px;font-size:15px;cursor:pointer;}
  .btn-green:disabled{background:#e5e7eb;color:#9ca3af;cursor:not-allowed;}
  .card{background:#f9fafb;border-radius:14px;padding:16px;margin-bottom:16px;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;z-index:999;max-width:320px;text-align:center;opacity:0;transition:opacity .3s;}
  .toast.show{opacity:1;}
  input[type=file]{width:100%;border:2px dashed #d1d5db;border-radius:12px;padding:10px;font-size:14px;margin-bottom:12px;background:#fff;}
  #qrVideo{width:100%;border-radius:16px;display:block;background:#000;}
  .scan-overlay{position:relative;}
  .scan-overlay::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:200px;height:100px;border:3px solid #facc15;border-radius:8px;box-shadow:0 0 0 9999px rgba(0,0,0,0.4);}
  label.field{display:block;font-size:12px;color:#9ca3af;margin-bottom:4px;font-weight:600;}
  .info-box{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:12px;font-size:13px;margin-bottom:14px;}
  .checkbox-row{display:flex;align-items:center;gap:10px;font-size:14px;margin-bottom:14px;padding:12px;background:#f9fafb;border-radius:10px;}
  .checkbox-row input{width:20px;height:20px;cursor:pointer;}
</style>
</head>
<body class="pb-24">

<div class="max-w-md mx-auto min-h-screen bg-white">

  <!-- Top bar -->
  <div id="wizardHeader" class="bg-[#FFD345] border-b-4 border-[#393be5] px-4 py-2 shadow-md flex justify-between items-center">
    <button onclick="goBack()" class="text-sm font-bold px-2 py-1">← Back</button>
    <span id="refBadge" class="text-xs font-bold bg-black text-white px-2 py-1 rounded-full">—</span>
  </div>

  <!-- Loading -->
  <div id="wizardBody">
<div id="loadingScreen" class="text-center py-20 text-gray-400">
    <div class="text-3xl mb-3">⏳</div>Loading order...
  </div>

  <!-- Error -->
  <div id="errorScreen" class="hidden px-6 py-20 text-center">
    <div class="text-4xl mb-4">⚠️</div>
    <p id="errorMsg" class="text-gray-600 mb-6"></p>
    <button onclick="goBack()" class="btn-secondary" style="width:auto;padding:10px 24px;">Go Back</button>
  </div>

  <!-- Wizard -->
  <div id="wizardScreen" class="hidden">

    <!-- Order info bar — above stepper -->
    <div class="mx-4 mt-3 mb-2 bg-gray-50 rounded-2xl p-3 flex gap-3 text-sm">
      <div class="flex-1">
        <p class="font-bold text-gray-900" id="infoName"></p>
        <p class="text-gray-400 text-xs" id="infoAddress"></p>
      </div>
      <div class="text-right">
        <p class="font-bold text-green-700" id="infoAmount"></p>
        <p class="text-xs" id="infoPayType"></p>
      </div>
    </div>

    <!-- Progress — below customer info -->
    <div class="px-4 pb-3 pt-1">
      <div class="flex items-center gap-1.5 justify-center mb-1.5" id="progressDots"></div>
      <p id="stepLabel" class="text-center text-sm font-semibold text-gray-700"></p>
    </div>

    <!-- Step content -->
    <div id="stepBody" class="px-4"></div>
  </div>

  <!-- Done -->
  <div id="doneScreen" class="hidden px-6 py-20 text-center">
    <div class="text-6xl mb-4" id="doneIcon">✅</div>
    <p class="text-2xl font-black text-gray-900 mb-2" id="doneTitle"></p>
    <p class="text-gray-500 mb-8" id="doneMsg"></p>
    <button onclick="location.replace('partner-task.html')" class="btn-primary" style="max-width:200px;margin:0 auto;">Back to Orders</button>
  </div>

</div>

</div><!-- /wizardBody -->
<!-- Toast -->
<div id="toast" class="toast"></div>

<script>
// ─── CONFIG ───────────────────────────────────────────────────
const SUPABASE_URL  = 'https://rohybhpktpfmeashdlzz.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJvaHliaHBrdHBmbWVhc2hkbHp6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MzcwMTYsImV4cCI6MjA5MzMxMzAxNn0.NhM9DnXOl_7h3NHh1r78cPNvbogO_qOEhPfQauyKHJE';
const BUCKET       = 'partner-uploads';
const db           = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

// ─── STATUS ORDER (used to find which step comes next) ────────
// The position in these arrays determines progression order.
// Delivery phase statuses in order:
const DELIVERY_ORDER = [
  'assigned','accepted','packed_scanned','out_for_delivery','reached_customer',
  'items_verified_delivery','bundle_photo_done','condition_ack_delivery',
  'id_verified','payment_collected','otp_verified_delivery','delivered'
];
// Return phase statuses in order:
const RETURN_ORDER = [
  'out_for_pickup','reached_pickup','items_verified_return',
  'condition_photo_return','otp_verified_return','completed'
];
// These statuses mean we are in return phase:
const RETURN_PHASE = new Set([
  'delivered','active_rental','return_window_open','out_for_pickup','reached_pickup',
  'items_verified_return','condition_photo_return','dispute_flagged','otp_verified_return',
  'completed','rated'
]);

// ─── STATE ────────────────────────────────────────────────────
const bookingId = new URLSearchParams(location.search).get('booking_id');
let partner  = null;
let booking  = null;
let cfg      = null;
let assets   = [];
let steps    = [];   // active step list, rebuilt each time
let stepIdx  = 0;    // which step to show

// ─── BOOT ─────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {
  const pid = sessionStorage.getItem('partner_id');
  const pin = sessionStorage.getItem('partner_pin');
  if (!pid || !pin) { location.href = 'partner-task.html'; return; }

  const { data: p } = await db.from('partners').select('*').eq('id', pid).eq('pin', pin).maybeSingle();
  if (!p || p.status !== 'active') { sessionStorage.clear(); location.href = 'partner-task.html'; return; }
  partner = p;

  if (!bookingId) { showError('No booking ID specified.'); return; }
  await loadBooking();
});

function goBack() { history.back(); }

// ─── LOAD ─────────────────────────────────────────────────────
async function loadBooking() {
  try {
    const { data: b, error: bErr } = await db.from('bookings').select('*').eq('id', bookingId).maybeSingle();
    if (bErr || !b) { showError('Order not found. It may have been reassigned.'); return; }
    if (String(b.assigned_partner_id) !== String(partner.id)) { showError('This order is not assigned to you.'); return; }
    booking = b;

    const { data: c } = await db.from('booking_effective_config').select('*').eq('booking_id', bookingId).maybeSingle();
    cfg = c || { scan_required: false, installation_included: true, id_verification_required: false, bundle_photo_count: 1, is_delivery_only: false, bundle_photo_required: true, condition_video_required: true };
    cfg.bundle_photo_required  = booking.bundle_photo_required  !== false;
    cfg.condition_video_required = booking.condition_video_required !== false;

    // Build order-specific item list:
    // 1. PS5 + correct number of controllers from partner_assets (high value = scan required)
    // 2. Default cables always included as tick-only checklist items
    const { data: allAssets } = await db
      .from('partner_assets')
      .select('*')
      .eq('partner_id', partner.id)
      .eq('status', 'available')
      .order('asset_type');

    const partnerAssets = allAssets || [];
    assets = buildOrderItemList(partnerAssets, booking);

    populateInfoBar();
    buildSteps();
    stepIdx = findFirstPendingStep();
    show('wizardScreen');
    hide('loadingScreen');
    renderStep();
  } catch (e) {
    console.error(e);
    showError('Failed to load order. Check your connection.');
  }
}

// ─── INFO BAR ─────────────────────────────────────────────────
function populateInfoBar() {
  const ds = getDS();
  const isCOD = booking.payment_method !== 'prepaid';
  const showAmt = isCOD || ds.show_amount !== false; // COD always shown

  document.getElementById('refBadge').textContent    = booking.reference_number || ('#' + booking.id);
  document.getElementById('infoName').textContent    = booking.customer_name    || 'Customer';
  document.getElementById('infoAddress').textContent = booking.address          || '—';

  const amtEl = document.getElementById('infoAmount');
  const pmEl  = document.getElementById('infoPayType');
  if (showAmt) {
    amtEl.textContent = '₹' + (booking.total_amount || 0);
    amtEl.style.display = '';
    const inReturn = RETURN_PHASE.has(booking.fulfillment_status);
    if (inReturn) {
      pmEl.textContent = 'Return pickup';
      pmEl.style.color = '#6b7280';
    } else {
      pmEl.textContent = isCOD ? 'COD – collect cash' : 'Prepaid ✅';
      pmEl.style.color = isCOD ? '#dc2626' : '#16a34a';
    }
    pmEl.style.display = '';
  } else {
    amtEl.style.display = 'none';
    pmEl.style.display  = 'none';
  }
}

// ─── BUILD STEP LIST ──────────────────────────────────────────
// Each step: { id, label, produces_status, render }
// produces_status = what DB status this step sets on completion
function buildSteps() {
  const inReturn = RETURN_PHASE.has(booking.fulfillment_status);

  if (!inReturn) {
    // ── DELIVERY STEPS ──
    const s = [];
    // Accept is handled in partner-task order list — not a wizard step
    s.push({ id:'pack_scan',    label:'📦 Pack & Verify',    produces_status:'packed_scanned',          render: () => stepScan('pack','packed_scanned') });
    s.push({ id:'out_deliver',  label:'Start Delivery',       produces_status:'reached_customer',        render: () => stepDepart('out_for_delivery','🛵  Start Delivery','delivery') });
    s.push({ id:'scan_deliver', label:'✅ Verify Items',     produces_status:'items_verified_delivery', render: () => stepScan('delivery','items_verified_delivery') });
    if (cfg.bundle_photo_required)
    s.push({ id:'photos',       label: cfg.installation_included ? 'Installation Photo' : 'Package Photo', produces_status:'bundle_photo_done', render: stepBundlePhoto });
    if (cfg.condition_video_required)
    s.push({ id:'condition',    label:'Condition Video',     produces_status:'condition_ack_delivery',  render: stepConditionPhoto });
    if (cfg.id_verification_required)
    s.push({ id:'id_verify',    label:'ID Verification',     produces_status:'id_verified',             render: stepIdVerify });
    if (booking.payment_method !== 'prepaid')
    s.push({ id:'payment',      label:'Collect Payment',     produces_status:'payment_collected',       render: stepPayment });
    s.push({ id:'otp_del',      label:'Customer OTP',        produces_status:'otp_verified_delivery',   render: () => stepOtp('delivery') });
    // No separate Delivered step — OTP advances directly to delivered
    steps = s;
  } else {
    // ── RETURN STEPS ──
    const s = [];
    s.push({ id:'out_pickup',   label:'Start Pickup',         produces_status:'reached_pickup',          render: () => stepDepart('out_for_pickup','🛵  Start Pickup','pickup') });
    s.push({ id:'scan_ret',     label:'Verify Items',         produces_status:'items_verified_return',  render: () => stepScan('return_customer','items_verified_return') });
    s.push({ id:'cond_ret',     label:'Condition Check',     produces_status:'condition_photo_return', render: stepReturnCondition });
    s.push({ id:'otp_ret',      label:'Return OTP',          produces_status:'otp_verified_return',    render: () => stepOtp('return') });
    s.push({ id:'stock',        label:'Back to Stock',       produces_status:'completed',              render: () => stepScan('return_partner','completed') });
    steps = s;
  }
}

// ─── FIND WHICH STEP TO SHOW ──────────────────────────────────
// Uses STATUS_ORDER to compare positions — immune to step list rebuilds.
function findFirstPendingStep() {
  const inReturn = RETURN_PHASE.has(booking.fulfillment_status);
  const order    = inReturn ? RETURN_ORDER : DELIVERY_ORDER;
  const curPos   = order.indexOf(booking.fulfillment_status); // -1 if not yet started

  for (let i = 0; i < steps.length; i++) {
    const stepPos = order.indexOf(steps[i].produces_status);
    // Show the first step whose produced status is AFTER the current status in order
    if (stepPos > curPos) return i;
  }
  // All steps done — show last step
  return steps.length - 1;
}

// ─── RENDER CURRENT STEP ──────────────────────────────────────
function renderStep() {
  // Progress dots
  document.getElementById('progressDots').innerHTML = steps.map((s, i) => {
    const cls = i < stepIdx ? 'done' : (i === stepIdx ? 'active' : '');
    return `<span class="dot ${cls}"></span>`;
  }).join('');
  document.getElementById('stepLabel').textContent =
    `Step ${stepIdx + 1} of ${steps.length} — ${steps[stepIdx].label}`;
  document.getElementById('stepBody').innerHTML = '';
  try {
    steps[stepIdx].render();
  } catch(e) {
    console.error('Render error:', e);
    document.getElementById('stepBody').innerHTML =
      `<div class="card text-red-500 text-sm">Something went wrong rendering this step. Please go back and try again.<br><small>${e.message}</small></div>`;
  }
}

// ─── ADVANCE TO NEXT STEP ─────────────────────────────────────
async function advance(newStatus, extraFields) {
  try {
    const payload = { fulfillment_status: newStatus, ...(extraFields || {}) };
    const { error } = await db.from('bookings').update(payload).eq('id', booking.id);
    if (error) throw error;

    // Update local booking object
    Object.assign(booking, payload);

    // Log the event (non-blocking — don't let logging failure block the wizard)
    logEvent(newStatus).catch(e => console.warn('logEvent failed (non-blocking):', e));

    // Special completion screens
    if (newStatus === 'delivered') {
      showDone('🎉', 'Delivery Complete!', 'Great job! The order is now active.');
      return;
    }
    if (newStatus === 'completed') {
      showDone('✅', 'Return Complete!', 'Rental closed. Well done!');
      return;
    }

    // Rebuild step list (phase may have changed) and find next step
    buildSteps();
    stepIdx = findFirstPendingStep();
    renderStep();
    window.scrollTo(0, 0);
  } catch(e) {
    console.error('advance() error:', e);
    toast('❌ Save failed: ' + (e.message || 'Check connection'), 4000);
    // Re-enable any disabled buttons
    document.querySelectorAll('button:disabled').forEach(b => b.disabled = false);
  }
}

// ─── STEP RENDERERS ───────────────────────────────────────────

// ACCEPT
function stepAccept() {
  const d = booking;
  el('stepBody').innerHTML = `
    <div class="card">
      <p class="text-xs text-gray-400 mb-3 font-semibold uppercase tracking-wide">Order Details</p>
      <div class="space-y-2 text-sm">
        <row><b>Customer:</b> ${d.customer_name || '—'}</row>
        <div><b>Phone:</b> ${d.phone || '—'}</div>
        <div><b>Address:</b> ${d.address || '—'}</div>
        <div><b>Date:</b> ${d.booking_date || '—'} &nbsp; ${d.start_time || ''} – ${d.end_time || ''}</div>
        <div><b>Plan:</b> ${d.plan || '—'}</div>
        <div><b>Amount:</b> <span class="text-green-700 font-bold">₹${d.total_amount || 0}</span> &nbsp; ${d.payment_method === 'prepaid' ? '(Prepaid ✅)' : '(COD – collect from customer)'}</div>
      </div>
    </div>
    <button class="btn-primary mb-3" onclick="doAccept()">Accept Order</button>
    <button class="btn-danger" onclick="doReject()">Reject Order</button>`;
}

async function doAccept() {
  setBusy(true, 'Accepting...');
  await advance('accepted');
  setBusy(false);
}

async function doReject() {
  if (!confirm('Reject this order? Admin will be notified to reassign.')) return;
  setBusy(true, 'Rejecting...');
  try {
    await db.from('bookings').update({ fulfillment_status: 'rejected', assigned_partner_id: null }).eq('id', booking.id);
    logEvent('rejected').catch(()=>{});
    toast('Order rejected. Admin notified.');
    setTimeout(() => location.replace('partner-task.html'), 1500);
  } catch(e) { toast('Failed to reject. Try again.', 3000); setBusy(false); }
}

// SIMPLE ACTION — for non-navigation steps (delivered, completed etc)
function stepSimple(nextStatus, btnLabel, desc) {
  el('stepBody').innerHTML =
    '<div class="info-box">' + desc + '</div>'
    + '<button class="btn-primary" id="simpleBtn" onclick="doSimple(\'' + nextStatus + '\')"> ' + btnLabel + '</button>';
}

async function doSimple(nextStatus) {
  var btn = el('simpleBtn');
  btn.disabled = true; btn.textContent = 'Please wait...';
  await advance(nextStatus);
}

// DEPART STEP — just the "Start" button, advances to out_for_delivery/pickup
function _getNavHtml(type) {
  var lat  = booking.location_lat || booking.customer_lat;
  var lng  = booking.location_lng || booking.customer_lng;
  var addr = booking.location_address || booking.address || '';
  var mapsUrl = lat && lng
    ? 'https://www.google.com/maps/dir/?api=1&destination=' + lat + ',' + lng
    : 'https://www.google.com/maps/search/' + encodeURIComponent(addr);
  var isDelivery = type === 'delivery';
  var ds2 = getDS(); var mode = ds2.contact_mode || 'both'; var phone = booking.phone || '';
  var contactBtns = '';
  if (mode === 'both' || mode === 'call')
    contactBtns += '<a href="tel:' + phone + '" style="display:block;text-align:center;background:#f3f4f6;color:#374151;font-weight:700;padding:11px;border-radius:12px;text-decoration:none;font-size:13px;margin-top:8px;">📞 Call Customer</a>';
  if (mode === 'both' || mode === 'whatsapp')
    contactBtns += '<a href="https://wa.me/91' + phone + '" target="_blank" style="display:block;text-align:center;background:#dcfce7;color:#15803d;font-weight:700;padding:11px;border-radius:12px;text-decoration:none;font-size:13px;margin-top:8px;">💬 WhatsApp Customer</a>';
  return '<div class="card mb-3">'
    + '<p class="text-xs text-gray-400 mb-1">📍 ' + (isDelivery ? 'Delivery' : 'Pickup') + ' Location</p>'
    + '<p class="font-semibold text-sm text-gray-900 mb-1">' + (addr || '—') + '</p>'
    + (lat && lng ? '<p class="text-xs text-green-600 mb-2">✅ Exact location available</p>' : '<p class="text-xs text-yellow-600 mb-2">⚠ Using text address</p>')
    + '<a href="' + mapsUrl + '" target="_blank" style="display:block;text-align:center;background:#000;color:#fff;font-weight:700;padding:12px;border-radius:12px;text-decoration:none;font-size:14px;">🗺 Open in Google Maps</a>'
    + '</div>'
    + contactBtns;
}

function stepDepart(departStatus, btnLabel, type) {
  var arrivedStatus = type === 'delivery' ? 'reached_customer' : 'reached_pickup';
  // If already departed (refreshed after clicking start), show nav + arrived button
  // Show arrived view if already departed (booking at transit status after start was clicked)
  var alreadyDeparted = (departStatus === 'out_for_delivery' && booking.fulfillment_status === 'out_for_delivery')
                     || (departStatus === 'out_for_pickup'   && booking.fulfillment_status === 'out_for_pickup');
  if (alreadyDeparted) {
    _showArrivedView(type, arrivedStatus);
    return;
  }
  el('stepBody').innerHTML =
    _getNavHtml(type)
    + '<div class="info-box" style="margin-top:12px">Customer will be notified on WhatsApp when you start.</div>'
    + '<button class="btn-primary" id="departBtn" onclick="doDepart(\'' + departStatus + '\',\'' + type + '\',\'' + arrivedStatus + '\')">' + btnLabel + '</button>';
}

async function doDepart(departStatus, type, arrivedStatus) {
  var btn = el('departBtn');
  btn.disabled = true; btn.textContent = 'Starting...';
  if (departStatus === 'out_for_delivery') notifyWA('out_for_delivery');
  if (departStatus === 'out_for_pickup')   notifyWA('out_for_pickup');
  // Update DB directly — do NOT call advance() as it would re-render to Verify Items
  const { error } = await db.from('bookings').update({ fulfillment_status: departStatus }).eq('id', booking.id);
  if (error) { toast('Failed: ' + error.message, 3000); btn.disabled = false; btn.textContent = 'Try again'; return; }
  booking.fulfillment_status = departStatus;
  logEvent(departStatus, {}).catch(() => {});
  _showArrivedView(type, arrivedStatus);
}

function _showArrivedView(type, arrivedStatus) {
  el('stepBody').innerHTML =
    '<div style="background:#f0fdf4;border:1.5px solid #bbf7d0;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:13px;font-weight:600;color:#15803d">✅ Customer notified on WhatsApp</div>'
    + _getNavHtml(type)
    + '<button class="btn-primary" id="arrivedBtn" disabled style="opacity:0.5;margin-top:12px">'
    + "📍 I've Arrived <span id='arrivedTimer'>(30s)</span></button>";
  // 30s countdown then enable
  var secs = 30;
  var timer = setInterval(function() {
    secs--;
    var t = el('arrivedTimer');
    if (t) t.textContent = secs > 0 ? '(' + secs + 's)' : '';
    if (secs <= 0) {
      clearInterval(timer);
      var b = el('arrivedBtn');
      if (b) { b.disabled = false; b.style.opacity = '1'; b.onclick = function(){ doArrived(arrivedStatus); }; }
    }
  }, 1000);
}

async function doArrived(nextStatus) {
  var btn = el('arrivedBtn');
  btn.disabled = true; btn.textContent = 'Marking arrived...';
  var geo = await getGeo();
  await advance(nextStatus, geo ? { last_partner_lat: geo.lat, last_partner_lng: geo.lng } : {});
}

// ── BUILD ORDER ITEM LIST ─────────────────────────────────────
// Combines partner DB assets (PS5, controllers) with fixed default
// accessories (cables) that are always included in every delivery.
// Returns array of items for the checklist/scan step.
function buildOrderItemList(partnerAssets, booking) {
  const items = [];

  // 1. PS5 Console — always required, high value, scan if barcode set
  const ps5 = partnerAssets.find(a => a.asset_type === 'ps5');
  if (ps5) {
    items.push({ ...ps5, _source: 'db' });
  } else {
    // No PS5 registered — add as tick-only placeholder so checklist still shows
    items.push({
      id: 'ps5_placeholder',
      asset_type: 'ps5',
      asset_label: 'PS5 Console',
      is_high_value: false,
      barcode: null,
      serial_number: null,
      _source: 'placeholder'
    });
  }

  // 2. Controllers — 1 default, 2 if customer added extra controller
  const controllersNeeded = booking.controllers_count || 1;
  const controllers = partnerAssets.filter(a => a.asset_type === 'controller');

  for (let i = 0; i < controllersNeeded; i++) {
    if (controllers[i]) {
      items.push({ ...controllers[i], _source: 'db' });
    } else {
      items.push({
        id: 'ctrl_placeholder_' + i,
        asset_type: 'controller',
        asset_label: i === 0 ? 'DualSense Controller' : ('Controller ' + (i + 1)),
        is_high_value: false,
        barcode: null,
        serial_number: null,
        _source: 'placeholder'
      });
    }
  }

  // 3. Default accessories — always included, tick-only (no scan), static items
  const defaultCables = [
    { id: 'cable_power',  asset_type: 'cable', asset_label: 'Power Cable',             is_high_value: false, barcode: null, _source: 'static' },
    { id: 'cable_hdmi',   asset_type: 'cable', asset_label: 'HDMI Cable',              is_high_value: false, barcode: null, _source: 'static' },
    { id: 'cable_typec',  asset_type: 'cable', asset_label: 'Type-C Cable',            is_high_value: false, barcode: null, _source: 'static' },
  ];
  defaultCables.forEach(c => items.push(c));

  // 4. Any other high-value assets the partner has (e.g. game discs, charging docks)
  const extraTypes = ['charging_dock', 'game_disc', 'other'];
  partnerAssets
    .filter(a => extraTypes.includes(a.asset_type))
    .forEach(a => items.push({ ...a, _source: 'db' }));

  return items;
}

// ── SCAN STEP ─────────────────────────────────────────────────
// ALL assets: mandatory checklist tick
// HIGH-VALUE assets (is_high_value=true): ALSO require camera barcode scan + match
// scan_required toggle only controls whether barcode scan is enforced for high-value items

let scannerInstance = null;   // html5-qrcode instance
let activeScanAssetId = null; // which asset is currently being scanned

function buildAssetRow(a, needsScan) {
  const typeIcon = { ps5:'🎮', controller:'🕹', charging_dock:'🔌', cable:'🔌', game_disc:'💿', other:'📦' };
  const icon = typeIcon[a.asset_type] || '📦';
  const sn   = a.serial_number ? '<p class="text-xs text-gray-400">S/N: ' + a.serial_number + '</p>' : '';
  const right = needsScan
    ? '<span class="text-xs text-gray-300 font-medium px-2">Waiting...</span>'
    : '<span class="text-2xl text-gray-300" id="tick_' + a.id + '">○</span>';
  const click = needsScan ? '' : "tickRow('" + a.id + "', this)";
  const cursor = needsScan ? '' : 'cursor-pointer';
  return '<div id="row_' + a.id + '" data-confirmed="0" onclick="' + click + '" class="border-2 rounded-xl px-4 py-3 transition-all ' + cursor + '" style="border-color:#e5e7eb">'
    + '<div class="flex items-center justify-between">'
    + '<div class="flex-1"><p class="font-semibold text-sm">' + icon + ' ' + (a.asset_label || a.asset_type) + '</p>' + sn + '</div>'
    + '<div id="action_' + a.id + '">' + right + '</div>'
    + '</div>'
    + '<p id="status_' + a.id + '" class="text-xs mt-1 hidden"></p>'
    + '</div>';
}

function stepScan(scanPoint, nextStatus) {
  if (!assets.length) {
    el('stepBody').innerHTML =
      '<div class="info-box">No assets registered. Ask admin to add items in the Partners tab.</div>'
      + '<button class="btn-primary" onclick="advance(\'' + nextStatus + '\')">Continue</button>';

      + '<video id="scanVideo" autoplay playsinline muted style="width:100%;height:100%;object-fit:cover;display:block"></video>'
      + '<canvas id="scanCanvas" style="display:none"></canvas>'
      + '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none">'
      + '<div style="width:220px;height:100px;border:3px solid #facc15;border-radius:10px;box-shadow:0 0 0 9999px rgba(0,0,0,0.55)"></div>'
      + '</div>'
      + '<p id="scanStatus" style="position:absolute;bottom:8px;left:0;right:0;text-align:center;color:#fff;font-size:12px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.8)">Starting camera...</p>'
      + '</div>'
      + '<div id="manualEntryArea" class="hidden mb-3"><div class="flex gap-2">'
      + '<input type="text" id="manualBarcodeInput" placeholder="Type barcode value" style="flex:1;border:2px solid #e5e7eb;border-radius:10px;padding:10px 12px;font-size:14px"/>'
      + '<button onclick="submitManualBarcode()" style="background:#000;color:#fff;font-weight:700;padding:10px 16px;border-radius:10px;font-size:14px">OK</button>'
      + '</div></div>'
      + '<button onclick="toggleManualEntry()" class="btn-secondary mb-3" style="font-size:12px;padding:8px">⌨ Can\'t scan? Type manually</button>';
  }

  var hint = needsScanItems.length ? 'Scan each item above · ' : '';

function tickRow(assetId, row) {
  var done = row.dataset.confirmed !== '1';
  row.dataset.confirmed = done ? '1' : '0';
  row.style.borderColor = done ? '#22c55e' : '#e5e7eb';
  row.style.background  = done ? '#f0fdf4' : '';
  var tick = el('tick_' + assetId);
  if (tick) { tick.textContent = done ? '✅' : '○'; tick.style.color = done ? '#22c55e' : ''; }
  checkAllDone();
}



// ── PERSISTENT SCANNER ───────────────────────────────────────
// One scanner stays open and auto-matches ANY item's barcode.
let _scanRafId  = null;
let _scanStream = null;
let _lastScan   = '';  // debounce

async function startPersistentScanner() {
  stopScanner();
  const video  = el('scanVideo');
  const canvas = el('scanCanvas');
  if (!video || !canvas) return;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  try {
    _scanStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    video.srcObject = _scanStream;
    await video.play();
    if (el('scanStatus')) el('scanStatus').textContent = 'Point camera at any item QR code';
    scannerInstance = true;
    _scanLoop(video, canvas, ctx);
  } catch(e) {
    console.error('Camera error:', e);
    if (el('scanStatus')) el('scanStatus').textContent = 'Camera error — type manually';
    const m = el('manualEntryArea');
    if (m) m.classList.remove('hidden');
  }
}

function _scanLoop(video, canvas, ctx) {
  if (!scannerInstance) return;
  if (video.readyState === video.HAVE_ENOUGH_DATA) {
    canvas.width  = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'dontInvert' });
    if (code && code.data && code.data !== _lastScan) {
      _lastScan = code.data;
      onScanSuccess(code.data);
      setTimeout(() => { _lastScan = ''; }, 2000);
    }
  }
  _scanRafId = requestAnimationFrame(() => _scanLoop(video, canvas, ctx));
}

function toggleManualEntry() {
  const area = el('manualEntryArea');
  if (!area) return;
  area.classList.toggle('hidden');
  if (!area.classList.contains('hidden'))
    setTimeout(() => el('manualBarcodeInput') && el('manualBarcodeInput').focus(), 100);
}

function submitManualBarcode() {
  const inp = el('manualBarcodeInput');
  const val = (inp ? inp.value : '').trim();
  if (!val) { toast('Enter the code', 2500); return; }
  inp.value = '';
  onScanSuccess(val);
}

function onScanSuccess(scannedText) {
  const scanned = scannedText.trim();

  // Find first unverified asset whose barcode matches
  const match = assets.find(a =>
    a.barcode && a.barcode.trim() === scanned &&
    el('row_' + a.id) && el('row_' + a.id).dataset.confirmed !== '1'
  );

  if (match) {
    const row      = el('row_' + match.id);
    const statusEl = el('status_' + match.id);
    const actionEl = el('action_' + match.id);
    row.style.borderColor = '#22c55e';
    row.style.background  = '#f0fdf4';
    row.dataset.confirmed = '1';
    if (actionEl) actionEl.innerHTML = '<span class="text-green-600 font-bold text-sm">✅</span>';
    if (statusEl) { statusEl.textContent = 'Scanned ✓'; statusEl.className = 'text-xs mt-1 text-green-600'; statusEl.classList.remove('hidden'); }
    toast('✅ ' + (match.asset_label || match.asset_type) + ' verified!');

    // Stop scanner when all scan-required items are done
    const pending = assets.filter(a => a.is_high_value && a.barcode && cfg.scan_required && el('row_' + a.id)?.dataset.confirmed !== '1');
    if (!pending.length) {
      stopScanner();
      if (el('scanStatus')) el('scanStatus').textContent = 'All items scanned ✅';
    } else {
      if (el('scanStatus')) el('scanStatus').textContent = `${pending.length} item(s) left — scan next`;
    }
    checkAllDone();
  } else {
    toast('⚠ Item not recognised — try again', 3000);
    if (el('scanStatus')) el('scanStatus').textContent = 'Unknown barcode — try another item';
  }
}

function stopScanner() {
  scannerInstance = null;
  if (_scanRafId)  { cancelAnimationFrame(_scanRafId); _scanRafId = null; }
  if (_scanStream) { _scanStream.getTracks().forEach(t => t.stop()); _scanStream = null; }
  const v = el('scanVideo');
  if (v) v.srcObject = null;
}


function checkAllDone() {
  const allRows = document.querySelectorAll('#assetList [id^="row_"]');
  const allDone = [...allRows].every(r => r.dataset.confirmed === '1');
  const btn = el('confirmAllBtn');
  if (btn) {
    btn.disabled = !allDone;
    btn.className = allDone ? 'btn-green' : 'btn-green' + ' opacity-40 cursor-not-allowed';
  }
}

async function doConfirmAll(scanPoint, nextStatus) {
  el('confirmAllBtn').disabled = true;
  el('confirmAllBtn').textContent = 'Saving...';

  // Stop scanner if somehow still running
  try { stopScanner(); } catch(e) {}

  try {
    const geo = await getGeo();
    // Only log real DB assets to asset_scans — skip static cables and placeholders
    const dbAssets = assets.filter(a => a._source === 'db' && a.id && !a.id.includes('placeholder'));
    if (dbAssets.length) {
      const rows = dbAssets.map(a => ({
        booking_id:  booking.id,
        asset_id:    a.id,
        scan_point:  scanPoint,
        scanned_by:  partner.phone,
        geo_lat:     geo ? geo.lat : null,
        geo_lng:     geo ? geo.lng : null
      }));
      const { error } = await db.from('asset_scans').insert(rows);
      if (error) throw error;
    }
    await advance(nextStatus);
  } catch(e) {
    toast('Save failed: ' + e.message, 4000);
    el('confirmAllBtn').disabled = false;
    el('confirmAllBtn').textContent = 'Confirm All & Continue';
  }
}

async function doSendOtp(stage) {
  if (!el('custAgree').checked) { toast('Please confirm customer agreed first.', 3000); return; }
  el('sendOtpBtn').disabled = true; el('sendOtpBtn').textContent = 'Sending...';

  // Save customer acknowledgement (non-blocking)
  try {
    await db.from('condition_acknowledgements').insert({
      booking_id: booking.id, stage, acknowledged_by: 'customer', agreed: true,
      photo_url: window._deliveryConditionUrl || null
    });
  } catch(e) { console.warn('ack insert:', e); }

  const otp = String(Math.floor(1000 + Math.random() * 9000));
  const field = stage === 'delivery' ? { delivery_otp: otp } : { return_otp: otp };
  await db.from('bookings').update(field).eq('id', booking.id);
  Object.assign(booking, field);

  try {
    const r = await fetch(`${SUPABASE_URL}/functions/v1/send-notification`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_ANON}` },
      body: JSON.stringify({ type: stage === 'delivery' ? 'delivery_otp' : 'return_otp', booking: { ...booking, otp } })
    });
    const res = await r.json();
    if (!res.success) throw new Error('WA send failed');
    toast('OTP sent to customer ✅');
  } catch(e) {
    toast(`WhatsApp failed. Read OTP to customer: ${otp}`, 6000);
  }
  el('sendOtpBtn').textContent = 'OTP Sent — Resend';
  el('sendOtpBtn').disabled = false;
}

async function doVerifyOtp(stage) {
  const entered  = (el('otpInput').value || '').trim();
  const expected = stage === 'delivery' ? booking.delivery_otp : booking.return_otp;
  if (!expected) { toast('Send the OTP first.', 3000); return; }
  if (entered !== expected) { toast('Incorrect OTP. Ask customer to check WhatsApp.', 3000); return; }
  el('verifyBtn').disabled = true; el('verifyBtn').textContent = 'Verifying...';
  const extra = stage === 'delivery' ? { delivery_otp_verified: true } : { return_otp_verified: true };
  if (stage === 'delivery') {
    // Skip separate delivered step — OTP verification marks as delivered directly
    await advance('otp_verified_delivery', extra);
    await advance('delivered');
  } else {
    await advance('otp_verified_return', extra);
  }
}

async function doOtpFallback(stage) {
  if (!confirm('Use fallback? Your location will be logged and admin will review this confirmation.')) return;
  const geo = await getGeo();
  try {
    await logEvent((stage === 'delivery' ? 'delivery' : 'return') + '_otp_fallback', {
      geo_lat: geo ? geo.lat : null, geo_lng: geo ? geo.lng : null,
      metadata: { reason: 'customer_unreachable' }
    });
  } catch(e) { console.warn('logEvent fallback:', e); }
  const extra = stage === 'delivery' ? { delivery_otp_verified: false } : { return_otp_verified: false };
  if (stage === 'delivery') {
    // Skip separate delivered step — OTP verification marks as delivered directly
    await advance('otp_verified_delivery', extra);
    await advance('delivered');
  } else {
    await advance('otp_verified_return', extra);
  }
  toast('Marked via fallback. Admin will review.');
}

// PAYMENT (COD)
function stepPayment() {
  // Customer already paid 10% advance online — collect only the remaining 90%
  const total       = booking.total_amount || 0;
  const advancePaid = Math.round(total * 0.10);
  const remaining   = total - advancePaid;
  el('stepBody').innerHTML = `
    <div class="info-box">
      Collect <b>₹${remaining}</b> from the customer.<br>
      <span class="text-xs text-gray-500 mt-1 block">Total: ₹${total} · Advance paid online: ₹${advancePaid} · Remaining: ₹${remaining}</span>
    </div>
    <p class="text-sm font-semibold text-gray-600 mb-3">Payment method received:</p>
    <div class="flex gap-3 mb-4">
      <button data-mode="cash" onclick="pickPayMode(this)" class="flex-1 border-2 rounded-xl py-3 font-bold text-sm">💵 Cash</button>
      <button data-mode="upi"  onclick="pickPayMode(this)" class="flex-1 border-2 rounded-xl py-3 font-bold text-sm">📱 UPI</button>
    </div>
    <button id="payBtn" class="btn-green" disabled onclick="doPayment()">Confirm Payment Collected</button>`;
}

function pickPayMode(btn) {
  document.querySelectorAll('[data-mode]').forEach(b => { b.style.borderColor=''; b.style.background=''; });
  btn.style.borderColor = '#22c55e'; btn.style.background = '#f0fdf4';
  window._payMode = btn.dataset.mode;
  el('payBtn').disabled = false;
}

async function doPayment() {
  el('payBtn').disabled = true; el('payBtn').textContent = 'Saving...';
  try {
    const total      = booking.total_amount || 0;
    const advancePaid = Math.round(total * 0.10);
    const collected  = total - advancePaid;  // what partner actually collected in cash
    await db.from('payment_ledger').insert({
      booking_id: booking.id, partner_id: partner.id,
      direction: 'partner_owes_leazo',
      amount: collected,
      commission_amount: (collected * (partner.commission_percent || 20)) / 100,
      status: 'pending'
    });
    await advance('payment_collected', { payment_status: 'paid' });
  } catch(e) { toast('Failed: ' + e.message, 4000); el('payBtn').disabled = false; el('payBtn').textContent = 'Confirm Payment Collected'; }
}

// ─── UTILITIES ────────────────────────────────────────────────
function el(id) { return document.getElementById(id); }
function getDS() {
  try { return JSON.parse(sessionStorage.getItem('partner_display_settings') || '{}'); }
  catch(e) { return {}; }
}
function show(id) { el(id).classList.remove('hidden'); }
function hide(id) { el(id).classList.add('hidden'); }

function showDone(icon, title, msg) {
  hide('wizardScreen'); hide('loadingScreen'); hide('errorScreen');
  el('doneIcon').textContent  = icon;
  el('doneTitle').textContent = title;
  el('doneMsg').textContent   = msg;
  show('doneScreen');
}

function showError(msg) {
  hide('loadingScreen'); hide('wizardScreen');
  el('errorMsg').textContent = msg;
  show('errorScreen');
}

let toastTimer;
function toast(msg, duration) {
  const t = el('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), duration || 2500);
}

function setBusy(busy, label) {
  document.querySelectorAll('button').forEach(b => b.disabled = busy);
  if (label && busy) {
    const primary = document.querySelector('.btn-primary');
    if (primary) primary.textContent = label;
  }
}

function getGeo() {
  return new Promise(resolve => {
    if (!navigator.geolocation) { resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      p => resolve({ lat: p.coords.latitude, lng: p.coords.longitude }),
      () => resolve(null),
      { enableHighAccuracy: true, timeout: 8000 }
    );
  });
}

// Compress images before upload — reduces 4MB phone photo to ~300KB
async function compressImage(file) {
  return new Promise((resolve) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const MAX = 1280;
      let w = img.width, h = img.height;
      if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      canvas.toBlob(blob => {
        resolve(new File([blob], 'photo.jpg', { type: 'image/jpeg' }));
      }, 'image/jpeg', 0.75); // 75% quality — good balance of size vs clarity
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); }; // fallback
    img.src = url;
  });
}

async function uploadPhoto(file, folder) {
  // Compress images — videos are uploaded as-is
  const toUpload = file.type.startsWith('image/') ? await compressImage(file) : file;
  const ext  = file.type.startsWith('image/') ? 'jpg' : (file.name.split('.').pop() || 'mp4').toLowerCase();
  const path = `${folder}/${booking.id}_${Date.now()}.${ext}`;
  const { error } = await db.storage.from(BUCKET).upload(path, toUpload, { upsert: true });
  if (error) throw new Error('Storage: ' + (error.message || JSON.stringify(error)));
  const { data } = db.storage.from(BUCKET).getPublicUrl(path);
  return data.publicUrl;
}

async function logEvent(eventType, opts) {
  opts = opts || {};
  let geo = null;
  if (!opts.geo_lat) { try { geo = await getGeo(); } catch(e) {} }
  await db.from('booking_events').insert({
    booking_id:  booking.id,
    event_type:  eventType,
    actor_type: 'partner',
    actor_id:    partner.phone,
    notes:       opts.notes      || null,
    photo_url:   opts.photo_url  || null,
    geo_lat:     opts.geo_lat    || (geo ? geo.lat : null),
    geo_lng:     opts.geo_lng    || (geo ? geo.lng : null),
    metadata:    opts.metadata   || null
  });
}

async function notifyWA(type) {
  try {
    await fetch(`${SUPABASE_URL}/functions/v1/send-notification`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_ANON}` },
      body: JSON.stringify({ type, booking })
    });
  } catch(e) { console.warn('WA notify failed (non-blocking):', e); }
}
