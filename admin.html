<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Leazo – Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body{background:#f3f4f6;}
  .status-pending_assignment,.status-assigned{background:#fef3c7;color:#92400e;}
  .status-accepted,.status-out_for_delivery,.status-reached_customer,.status-packed_scanned{background:#dbeafe;color:#1e40af;}
  .status-delivered,.status-active_rental,.status-otp_verified_delivery{background:#d1fae5;color:#065f46;}
  .status-out_for_pickup,.status-reached_pickup,.status-otp_verified_return{background:#ede9fe;color:#5b21b6;}
  .status-completed,.status-rated{background:#e5e7eb;color:#374151;}
  .status-dispute_flagged,.status-rejected{background:#fee2e2;color:#991b1b;}
  .status-payment_collected,.status-items_verified_delivery,.status-bundle_photo_done,.status-condition_ack_delivery,.status-id_verified,.status-items_verified_return,.status-condition_photo_return{background:#fef9c3;color:#713f12;}
  .tab-btn{padding:8px 18px;border-radius:999px;font-size:13px;font-weight:600;border:2px solid transparent;white-space:nowrap;cursor:pointer;}
  .tab-btn.active{background:#000;color:#fff;}
  .tab-btn:not(.active){background:#fff;color:#374151;border-color:#e5e7eb;}
  .card{background:#fff;border-radius:18px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:16px;margin-bottom:12px;}
  select{width:100%;border:2px solid #e5e7eb;border-radius:10px;padding:10px 12px;font-size:14px;background:#fff;cursor:pointer;}
  select:focus{outline:none;border-color:#facc15;}
  .btn-yellow{background:#facc15;border-bottom:3px solid #ca8a04;color:#000;font-weight:700;padding:10px 16px;border-radius:10px;font-size:13px;cursor:pointer;width:100%;}
  .btn-yellow:disabled{background:#e5e7eb;border-color:#d1d5db;color:#9ca3af;cursor:not-allowed;}
  .badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
  .modal{background:#fff;border-radius:24px 24px 0 0;padding:24px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:11px 20px;border-radius:12px;font-size:14px;z-index:999;max-width:320px;text-align:center;opacity:0;transition:opacity .3s;pointer-events:none;}
  .toast.show{opacity:1;}
</style>
</head>
<body class="font-sans pb-24">

<!-- LOGIN -->
<div id="loginScreen" class="min-h-screen flex items-center justify-center px-4">
  <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-sm">
    <div class="text-center mb-6">
      <h1 class="text-3xl font-black italic tracking-widest">LEAZO</h1>
      <p class="text-sm text-gray-400 mt-1">Admin Panel</p>
    </div>
    <input id="adminPass" type="password" placeholder="Admin password"
      class="w-full border-2 rounded-xl px-4 py-3 mb-4 focus:outline-none focus:border-yellow-400"/>
    <button onclick="doLogin()"
      class="w-full bg-yellow-400 border-b-4 border-yellow-600 text-black font-bold py-3 rounded-xl">Login</button>
    <p id="loginErr" class="text-red-500 text-sm text-center mt-3 hidden">Wrong password.</p>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">

  <!-- Top bar -->
  <div class="bg-yellow-400 border-b-4 border-blue-600 px-4 py-3 flex justify-between items-center sticky top-0 z-10">
    <span class="text-xl font-black italic tracking-widest">LEAZO</span>
    <div class="flex items-center gap-3">
      <span class="text-xs font-bold bg-black text-white px-3 py-1 rounded-full">ADMIN</span>
      <button onclick="doLogout()" class="text-xs text-gray-700 underline">Logout</button>
    </div>
  </div>

  <!-- Stats bar -->
  <div class="grid grid-cols-4 gap-2 px-3 py-3">
    <div class="bg-white rounded-xl p-2 text-center shadow-sm">
      <p class="text-lg font-black text-yellow-500" id="statUnassigned">—</p>
      <p class="text-xs text-gray-400">Unassigned</p>
    </div>
    <div class="bg-white rounded-xl p-2 text-center shadow-sm">
      <p class="text-lg font-black text-blue-500" id="statActive">—</p>
      <p class="text-xs text-gray-400">Active</p>
    </div>
    <div class="bg-white rounded-xl p-2 text-center shadow-sm">
      <p class="text-lg font-black text-green-500" id="statDelivered">—</p>
      <p class="text-xs text-gray-400">Delivered</p>
    </div>
    <div class="bg-white rounded-xl p-2 text-center shadow-sm">
      <p class="text-lg font-black text-red-400" id="statDisputes">—</p>
      <p class="text-xs text-gray-400">Disputes</p>
    </div>
  </div>

  <!-- Filters -->
  <div class="flex gap-2 px-3 pb-3 overflow-x-auto">
    <button class="tab-btn active" data-filter="all"         onclick="setFilter(this)">All</button>
    <button class="tab-btn"        data-filter="unassigned"  onclick="setFilter(this)">Unassigned</button>
    <button class="tab-btn"        data-filter="in_progress" onclick="setFilter(this)">In Progress</button>
    <button class="tab-btn"        data-filter="delivered"   onclick="setFilter(this)">Delivered</button>
    <button class="tab-btn"        data-filter="completed"   onclick="setFilter(this)">Completed</button>
    <button class="tab-btn"        data-filter="dispute"     onclick="setFilter(this)">Disputes</button>
  </div>

  <!-- City filter -->
  <div class="px-3 mb-3">
    <select id="cityFilter" onchange="renderBookings()">
      <option value="">All Cities</option>
    </select>
  </div>

  <!-- Booking list -->
  <div id="bookingList" class="px-3 space-y-3">
    <p class="text-center text-gray-400 py-10" id="loadingMsg">Loading...</p>
  </div>

  <!-- Refresh FAB -->
  <button onclick="loadAll()"
    class="fixed bottom-5 right-5 bg-black text-white w-14 h-14 rounded-full shadow-xl text-2xl flex items-center justify-center">↻</button>
</div>

<!-- ASSIGN MODAL -->
<div id="assignModal" class="modal-bg hidden" onclick="closeModal(event)">
  <div class="modal">
    <h2 class="text-lg font-black mb-1" id="modalTitle">Assign Order</h2>
    <p class="text-sm text-gray-400 mb-4" id="modalSubtitle"></p>

    <!-- Current assignment info -->
    <div id="currentAssignment" class="hidden bg-blue-50 border border-blue-200 rounded-xl p-3 mb-4 text-sm">
      <p class="font-semibold text-blue-800" id="currentAssignText"></p>
    </div>

    <!-- Partner select -->
    <label class="block text-xs font-bold text-gray-400 mb-1">SELECT PARTNER</label>
    <select id="partnerSelect" class="mb-4">
      <option value="">— Choose a partner —</option>
    </select>

    <!-- Config overrides -->
    <div class="bg-gray-50 rounded-xl p-3 mb-4 space-y-3">
      <p class="text-xs font-bold text-gray-400 uppercase tracking-wide">Order Config (overrides partner defaults)</p>

      <label class="flex items-center justify-between text-sm">
        <span>Delivery + Installation</span>
        <input type="checkbox" id="cfgInstall" class="w-5 h-5"/>
      </label>
      <label class="flex items-center justify-between text-sm">
        <span>Scan Required</span>
        <input type="checkbox" id="cfgScan" class="w-5 h-5"/>
      </label>
      <label class="flex items-center justify-between text-sm">
        <span>ID Verification Required</span>
        <input type="checkbox" id="cfgIdVerify" class="w-5 h-5"/>
      </label>
    </div>

    <button class="btn-yellow mb-3" id="assignBtn" onclick="doAssign()">Assign Partner</button>
    <button class="w-full text-sm text-gray-400 py-2" onclick="closeModalDirect()">Cancel</button>
  </div>
</div>

<!-- TOAST -->
<div id="toast" class="toast"></div>

<script>
const SUPABASE_URL  = 'https://rohybhpktpfmeashdlzz.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJvaHliaHBrdHBmbWVhc2hkbHp6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MzcwMTYsImV4cCI6MjA5MzMxMzAxNn0.NhM9DnXOl_7h3NHh1r78cPNvbogO_qOEhPfQauyKHJE';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

// ── CHANGE THIS to your admin password ──
const ADMIN_PASSWORD = 'leazoadmin2024';
// ────────────────────────────────────────

let allBookings = [];
let allPartners = [];
let currentFilter = 'all';
let modalBookingId = null;

// ── AUTH ──────────────────────────────────────────────────────
function doLogin() {
  const pass = document.getElementById('adminPass').value.trim();
  if (pass === ADMIN_PASSWORD) {
    sessionStorage.setItem('admin_auth', '1');
    showDashboard();
  } else {
    document.getElementById('loginErr').classList.remove('hidden');
  }
}
document.getElementById('adminPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

function doLogout() { sessionStorage.clear(); location.reload(); }

window.addEventListener('DOMContentLoaded', () => {
  if (sessionStorage.getItem('admin_auth') === '1') showDashboard();
});

function showDashboard() {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('dashboard').classList.remove('hidden');
  loadAll();
}

// ── LOAD DATA ─────────────────────────────────────────────────
async function loadAll() {
  await Promise.all([loadBookings(), loadPartners()]);
}

async function loadBookings() {
  document.getElementById('loadingMsg') && (document.getElementById('loadingMsg').textContent = 'Loading...');
  const { data, error } = await db
    .from('bookings')
    .select('*')
    .order('created_at', { ascending: false });

  if (error) { toast('Failed to load bookings', 3000); return; }
  allBookings = data || [];

  // Populate city filter
  const cities = [...new Set(allBookings.map(b => b.city).filter(Boolean))].sort();
  const cityFilter = document.getElementById('cityFilter');
  const current = cityFilter.value;
  cityFilter.innerHTML = `<option value="">All Cities</option>` +
    cities.map(c => `<option value="${c}" ${c === current ? 'selected' : ''}>${c}</option>`).join('');

  updateStats();
  renderBookings();
}

async function loadPartners() {
  const { data } = await db.from('partners').select('id, name, city, phone, status, commission_percent').eq('status', 'active').order('name');
  allPartners = data || [];
}

// ── STATS ─────────────────────────────────────────────────────
function updateStats() {
  const unassigned = allBookings.filter(b => !b.assigned_partner_id && b.payment_status === 'paid').length;
  const active     = allBookings.filter(b => b.assigned_partner_id && !['completed','rated','rejected'].includes(b.fulfillment_status)).length;
  const delivered  = allBookings.filter(b => ['delivered','active_rental'].includes(b.fulfillment_status)).length;
  const disputes   = allBookings.filter(b => b.fulfillment_status === 'dispute_flagged').length;
  document.getElementById('statUnassigned').textContent = unassigned;
  document.getElementById('statActive').textContent     = active;
  document.getElementById('statDelivered').textContent  = delivered;
  document.getElementById('statDisputes').textContent   = disputes;
}

// ── FILTER + RENDER ───────────────────────────────────────────
function setFilter(btn) {
  currentFilter = btn.dataset.filter;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
  renderBookings();
}

function renderBookings() {
  const city    = document.getElementById('cityFilter').value;
  let filtered  = allBookings;

  // City filter
  if (city) filtered = filtered.filter(b => b.city === city);

  // Tab filter
  if (currentFilter === 'unassigned')
    filtered = filtered.filter(b => !b.assigned_partner_id && b.payment_status === 'paid');
  else if (currentFilter === 'in_progress')
    filtered = filtered.filter(b => b.assigned_partner_id && !['delivered','active_rental','completed','rated','rejected','dispute_flagged'].includes(b.fulfillment_status));
  else if (currentFilter === 'delivered')
    filtered = filtered.filter(b => ['delivered','active_rental','return_window_open','out_for_pickup','reached_pickup','items_verified_return','condition_photo_return','otp_verified_return'].includes(b.fulfillment_status));
  else if (currentFilter === 'completed')
    filtered = filtered.filter(b => ['completed','rated'].includes(b.fulfillment_status));
  else if (currentFilter === 'dispute')
    filtered = filtered.filter(b => b.fulfillment_status === 'dispute_flagged');

  const list = document.getElementById('bookingList');
  if (!filtered.length) {
    list.innerHTML = `<p class="text-center text-gray-400 py-10">No bookings here</p>`;
    return;
  }
  list.innerHTML = filtered.map(b => bookingCard(b)).join('');
}

// ── BOOKING CARD ──────────────────────────────────────────────
function statusLabel(s) {
  const map = {
    pending_assignment: 'Pending', assigned: 'Assigned', accepted: 'Accepted',
    packed_scanned: 'Packed', out_for_delivery: 'Out for Delivery',
    reached_customer: 'Reached', id_verified: 'ID Verified',
    items_verified_delivery: 'Items Checked', bundle_photo_done: 'Photo Done',
    condition_ack_delivery: 'Condition OK', otp_verified_delivery: 'OTP Verified',
    payment_collected: 'Payment Collected', delivered: 'Delivered',
    active_rental: 'Active Rental', return_window_open: 'Return Due',
    out_for_pickup: 'Out for Pickup', reached_pickup: 'Reached Pickup',
    items_verified_return: 'Items Checked', condition_photo_return: 'Condition Checked',
    otp_verified_return: 'Return OTP OK', completed: 'Completed',
    dispute_flagged: '⚠ Dispute', rejected: 'Rejected', rated: 'Rated'
  };
  return map[s] || (s || 'Pending').replace(/_/g,' ');
}

function bookingCard(b) {
  const date = new Date(b.created_at).toLocaleDateString('en-IN', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
  const partner = allPartners.find(p => p.id === b.assigned_partner_id);
  const fs = b.fulfillment_status || 'pending_assignment';
  const needsAssign = !b.assigned_partner_id && b.payment_status === 'paid';
  const isDispute = fs === 'dispute_flagged';

  return `
    <div class="card ${needsAssign ? 'ring-2 ring-yellow-400' : ''} ${isDispute ? 'ring-2 ring-red-400' : ''}">

      <!-- Header -->
      <div class="flex justify-between items-start mb-3">
        <div>
          <p class="font-bold text-gray-900 text-base">${b.customer_name || '—'}</p>
          <p class="text-gray-400 text-xs">${date} &nbsp;·&nbsp; ${b.city || '—'}</p>
        </div>
        <span class="badge status-${fs}">${statusLabel(fs)}</span>
      </div>

      <!-- Details grid -->
      <div class="grid grid-cols-3 gap-2 text-xs mb-3">
        <div class="bg-gray-50 rounded-xl p-2">
          <p class="text-gray-400">Plan</p>
          <p class="font-semibold">${b.plan || '—'}</p>
        </div>
        <div class="bg-gray-50 rounded-xl p-2">
          <p class="text-gray-400">Date</p>
          <p class="font-semibold">${b.booking_date || '—'}</p>
        </div>
        <div class="bg-gray-50 rounded-xl p-2">
          <p class="text-gray-400">Amount</p>
          <p class="font-bold text-green-700">₹${b.total_amount || 0}</p>
        </div>
      </div>

      <!-- Address -->
      <div class="bg-gray-50 rounded-xl p-2 text-xs mb-3">
        <p class="text-gray-400 mb-0.5">Address</p>
        <p class="font-medium">${b.address || '—'}</p>
      </div>

      <!-- Partner assignment status -->
      <div class="flex items-center justify-between mb-3">
        <div class="text-xs">
          ${partner
            ? `<span class="text-gray-400">Assigned to</span> <span class="font-bold text-gray-800">${partner.name}</span> <span class="text-gray-400">(${partner.city})</span>`
            : b.payment_status === 'paid'
              ? `<span class="text-yellow-600 font-bold">⚠ Needs assignment</span>`
              : `<span class="text-gray-400">Payment pending</span>`}
        </div>
        <div class="flex gap-1">
          ${b.payment_status === 'paid'
            ? `<span class="badge bg-green-100 text-green-700">Paid</span>`
            : `<span class="badge bg-red-100 text-red-700">COD</span>`}
        </div>
      </div>

      <!-- Action buttons -->
      <div class="flex gap-2">
        <a href="tel:${b.phone}" class="flex-1 text-center text-xs font-bold bg-gray-100 text-gray-700 py-2 rounded-xl">📞 ${b.phone}</a>
        <a href="https://wa.me/91${b.phone}" target="_blank" class="flex-1 text-center text-xs font-bold bg-green-100 text-green-700 py-2 rounded-xl">💬 WhatsApp</a>
        ${b.payment_status === 'paid'
          ? `<button onclick="openAssignModal(${b.id})" class="flex-1 text-xs font-bold ${needsAssign ? 'bg-yellow-400 text-black' : 'bg-gray-800 text-white'} py-2 rounded-xl">
              ${partner ? '✏ Reassign' : '+ Assign'}
            </button>`
          : ''}
      </div>

      <!-- Ref + fulfillment progress -->
      <div class="flex items-center justify-between mt-3 pt-2 border-t border-gray-100 text-xs text-gray-400">
        <span>Ref: ${b.reference_number || b.id}</span>
        ${fs !== 'pending_assignment' && fs !== 'assigned' ? `<button onclick="viewTimeline(${b.id})" class="text-blue-500 underline">View timeline</button>` : ''}
      </div>
    </div>`;
}

// ── ASSIGN MODAL ──────────────────────────────────────────────
function openAssignModal(bookingId) {
  modalBookingId = bookingId;
  const b = allBookings.find(x => x.id === bookingId);
  if (!b) return;

  document.getElementById('modalTitle').textContent = `Assign: ${b.customer_name}`;
  document.getElementById('modalSubtitle').textContent = `${b.plan} · ${b.booking_date} · ${b.city}`;

  // Current assignment
  const partner = allPartners.find(p => p.id === b.assigned_partner_id);
  const currEl  = document.getElementById('currentAssignment');
  if (partner) {
    currEl.classList.remove('hidden');
    document.getElementById('currentAssignText').textContent = `Currently assigned to: ${partner.name} (${partner.city})`;
  } else {
    currEl.classList.add('hidden');
  }

  // Populate partner dropdown — show partners in same city first
  const cityPartners  = allPartners.filter(p => p.city === b.city);
  const otherPartners = allPartners.filter(p => p.city !== b.city);
  let opts = `<option value="">— Choose a partner —</option>`;
  if (cityPartners.length) {
    opts += `<optgroup label="${b.city} Partners">`;
    cityPartners.forEach(p => {
      opts += `<option value="${p.id}" ${p.id === b.assigned_partner_id ? 'selected' : ''}>${p.name} · ${p.commission_percent}% commission</option>`;
    });
    opts += `</optgroup>`;
  }
  if (otherPartners.length) {
    opts += `<optgroup label="Other Cities">`;
    otherPartners.forEach(p => {
      opts += `<option value="${p.id}">${p.name} · ${p.city} · ${p.commission_percent}%</option>`;
    });
    opts += `</optgroup>`;
  }
  document.getElementById('partnerSelect').innerHTML = opts;

  // Set config toggles to current effective values
  document.getElementById('cfgInstall').checked   = b.installation_included_override !== false;
  document.getElementById('cfgScan').checked       = b.scan_required_override !== false;
  document.getElementById('cfgIdVerify').checked   = b.id_verification_required_override === true;

  document.getElementById('assignModal').classList.remove('hidden');
}

function closeModal(e) {
  if (e.target.id === 'assignModal') closeModalDirect();
}
function closeModalDirect() {
  document.getElementById('assignModal').classList.add('hidden');
  modalBookingId = null;
}

async function doAssign() {
  const partnerId = document.getElementById('partnerSelect').value;
  if (!partnerId) { toast('Please select a partner', 3000); return; }

  const btn = document.getElementById('assignBtn');
  btn.disabled = true; btn.textContent = 'Assigning...';

  const install  = document.getElementById('cfgInstall').checked;
  const scan     = document.getElementById('cfgScan').checked;
  const idVerify = document.getElementById('cfgIdVerify').checked;

  try {
    const { error } = await db.from('bookings').update({
      assigned_partner_id:               partnerId,
      assigned_at:                       new Date().toISOString(),
      assigned_by:                       'admin',
      fulfillment_status:                'assigned',
      installation_included_override:    install,
      scan_required_override:            scan,
      id_verification_required_override: idVerify,
    }).eq('id', modalBookingId);

    if (error) throw error;

    // Notify partner via WhatsApp
    const b       = allBookings.find(x => x.id === modalBookingId);
    const partner = allPartners.find(p => p.id === partnerId);
    if (b && partner) {
      notifyPartner(b, partner).catch(e => console.warn('Partner notify failed:', e));
    }

    // Update local state
    const idx = allBookings.findIndex(x => x.id === modalBookingId);
    if (idx >= 0) {
      allBookings[idx].assigned_partner_id = partnerId;
      allBookings[idx].fulfillment_status  = 'assigned';
    }

    toast(`✅ Assigned to ${partner?.name || 'partner'}`);
    closeModalDirect();
    updateStats();
    renderBookings();
  } catch(e) {
    toast('Assignment failed: ' + e.message, 4000);
  }
  btn.disabled = false; btn.textContent = 'Assign Partner';
}

async function notifyPartner(booking, partner) {
  // Sends operator_new_booking template directly to the partner's phone
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/send-notification`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_ANON}` },
      body: JSON.stringify({
        type: 'partner_assigned',
        booking,
        partner: { name: partner.name, phone: partner.phone, city: partner.city, commission_percent: partner.commission_percent }
      })
    });
    const json = await res.json();
    if (!json.success) throw new Error('WA send returned failure');
    toast(`📲 Partner notified on WhatsApp`);
  } catch(e) {
    console.warn('Partner WA notify failed:', e);
    toast('⚠ Assignment saved but WhatsApp notify failed. Message partner manually.', 5000);
  }
}

// ── TIMELINE MODAL ────────────────────────────────────────────
async function viewTimeline(bookingId) {
  const { data: events } = await db
    .from('booking_events')
    .select('*')
    .eq('booking_id', bookingId)
    .order('created_at', { ascending: true });

  if (!events || !events.length) { toast('No timeline events yet', 2500); return; }

  const rows = events.map(e => {
    const t = new Date(e.created_at).toLocaleString('en-IN', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
    return `<div class="flex gap-3 text-sm pb-3 border-b border-gray-100 last:border-0">
      <div class="w-2 h-2 rounded-full bg-yellow-400 mt-1.5 flex-shrink-0"></div>
      <div class="flex-1">
        <p class="font-semibold text-gray-800">${e.event_type.replace(/_/g,' ')}</p>
        <p class="text-xs text-gray-400">${t} · ${e.actor_type}${e.actor_id ? ' · ' + e.actor_id : ''}</p>
        ${e.notes ? `<p class="text-xs text-gray-500 mt-0.5">${e.notes}</p>` : ''}
        ${e.photo_url ? `<a href="${e.photo_url}" target="_blank" class="text-xs text-blue-500 underline">View photo</a>` : ''}
        ${e.geo_lat ? `<a href="https://maps.google.com/?q=${e.geo_lat},${e.geo_lng}" target="_blank" class="text-xs text-blue-500 underline ml-2">View location</a>` : ''}
      </div>
    </div>`;
  }).join('');

  const b = allBookings.find(x => x.id === bookingId);
  document.getElementById('assignModal').classList.remove('hidden');
  document.querySelector('.modal').innerHTML = `
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-lg font-black">Timeline</h2>
      <button onclick="closeModalDirect()" class="text-gray-400 text-2xl leading-none">&times;</button>
    </div>
    <p class="text-sm text-gray-400 mb-4">${b?.customer_name || ''} · Ref: ${b?.reference_number || bookingId}</p>
    <div class="space-y-0">${rows}</div>
    <button onclick="closeModalDirect()" class="w-full mt-5 bg-gray-100 text-gray-600 font-bold py-3 rounded-xl">Close</button>`;
}

// ── UTILS ─────────────────────────────────────────────────────
let toastTimer;
function toast(msg, dur) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), dur || 2500);
}
</script>
</body>
</html>
