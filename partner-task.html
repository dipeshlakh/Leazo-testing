<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Leazo – Partner App</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#FFD345" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Leazo Partner" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&display=swap');
    html, body {
      background: #f3f4f6;
      height: 100%;
      overscroll-behavior: none;       /* prevents pull-to-refresh and elastic scroll */
      -webkit-overflow-scrolling: touch;
    }
    /* Login screen — truly fixed, zero scroll */
    #loginScreen {
      position: fixed;
      inset: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: #f3f4f6;
    }
    /* Body scroll unlocked — loginScreen overlay covers everything via position:fixed */
    /* Dashboard header — truly fixed, not sticky */
    #dashHeader {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
    }
    /* Push dashboard content below fixed header */
    #dashContent {
      padding-top: 60px;
    }
    .status-pending_assignment, .status-assigned { background:#fef3c7; color:#92400e; }
    .status-accepted, .status-packed_scanned, .status-out_for_delivery, .status-reached_customer { background:#dbeafe; color:#1e40af; }
    .status-delivered, .status-active_rental { background:#d1fae5; color:#065f46; }
    .status-out_for_pickup, .status-reached_pickup, .status-return_window_open { background:#ede9fe; color:#5b21b6; }
    .status-completed, .status-rated { background:#e5e7eb; color:#374151; }
    .status-dispute_flagged { background:#fee2e2; color:#991b1b; }
  </style>
</head>
<body class="font-sans pb-20">

  <!-- Login Screen -->
  <div id="loginScreen">
    <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-sm">
      <div class="text-center mb-6">
        <h1 class="text-3xl font-extrabold italic text-gray-900" style="font-family: 'Anton', sans-serif; letter-spacing: 3px;">LEAZO</h1>
        <p class="text-sm font-semibold text-gray-700 mt-1 tracking-wide text-center">Partner</p>
      </div>
      <input id="phoneInput" type="tel" placeholder="Phone number" maxlength="10"
        class="w-full border-2 rounded-xl px-4 py-3 text-gray-800 focus:outline-none focus:border-yellow-400 mb-3" />
      <input id="pinInput" type="password" placeholder="4-digit PIN" maxlength="4" inputmode="numeric"
        class="w-full border-2 rounded-xl px-4 py-3 text-gray-800 focus:outline-none focus:border-yellow-400 mb-4" />
      <label class="flex items-center gap-2 text-sm text-gray-600 mb-4 cursor-pointer">
        <input type="checkbox" id="rememberMe" class="w-4 h-4"/>
        Remember me on this device
      </label>
      <button onclick="checkLogin()"
        class="w-full bg-yellow-400 border-b-4 border-yellow-600 text-black font-bold py-3 rounded-xl hover:bg-yellow-500 transition">
        Login
      </button>
      <p id="loginError" class="text-red-500 text-sm text-center mt-3 hidden">Invalid phone or PIN.</p>
    </div>
  </div>

  <!-- Order List -->
  <div id="dashboard" class="hidden">

    <div id="dashHeader" class="bg-[#FFD345] border-b-4 border-[#393be5] px-4 py-2 shadow-md flex justify-between items-center">
      <div class="flex flex-col items-center leading-tight">
        <span class="text-2xl font-extrabold italic text-gray-900" style="font-family: 'Anton', sans-serif; letter-spacing: 3px;">LEAZO</span>
        <span class="text-xs font-semibold text-gray-700" style="margin-top:-2px;letter-spacing:0.05em">Partner</span>
      </div>
      <div class="flex items-center gap-3">
        <span id="cityBadge" class="text-xs font-bold bg-black text-white px-3 py-1 rounded-full"></span>
        <button onclick="logout()" class="text-xs text-gray-700 underline">Logout</button>
      </div>
    </div>

    <div id="dashContent">
    <div class="px-4 py-3">
      <p class="text-sm text-gray-500">Welcome,</p>
      <p id="partnerName" class="text-lg font-bold text-gray-900"></p>
    </div>

    <!-- Filter tabs -->
    <div class="flex gap-2 px-3 pb-3 overflow-x-auto">
      <button onclick="setFilter('active')" class="filter-btn px-4 py-1.5 rounded-full text-sm font-medium bg-black text-white whitespace-nowrap" data-filter="active">Active</button>
      <button onclick="setFilter('all')" class="filter-btn px-4 py-1.5 rounded-full text-sm font-medium bg-white text-gray-700 border whitespace-nowrap" data-filter="all">All</button>
      <button onclick="setFilter('completed')" class="filter-btn px-4 py-1.5 rounded-full text-sm font-medium bg-white text-gray-700 border whitespace-nowrap" data-filter="completed">Completed</button>
    </div>

    <div id="ordersList" class="px-3 space-y-3">
      <p class="text-center text-gray-400 py-10" id="loadingMsg">Loading orders...</p>
    </div>

    <div class="fixed bottom-4 right-4">
      <button onclick="loadOrders()" class="bg-black text-white w-14 h-14 rounded-full shadow-xl flex items-center justify-center text-2xl">↻</button>
    </div>
    </div><!-- /dashContent -->
  </div>

  <script>
    const SUPABASE_URL = 'https://rohybhpktpfmeashdlzz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJvaHliaHBrdHBmbWVhc2hkbHp6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MzcwMTYsImV4cCI6MjA5MzMxMzAxNn0.NhM9DnXOl_7h3NHh1r78cPNvbogO_qOEhPfQauyKHJE';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentPartner = null;
    let currentFilter = "active";
    let allOrders = [];

    const ACTIVE_STATUSES = [
      "assigned","accepted","packed_scanned","out_for_delivery","reached_customer",
      "id_verified","items_verified_delivery","bundle_photo_done","condition_ack_delivery",
      "payment_collected","otp_verified_delivery","delivered","active_rental",
      "return_window_open","out_for_pickup","reached_pickup","items_verified_return",
      "condition_photo_return","dispute_flagged","otp_verified_return"
    ];
    const COMPLETED_STATUSES = ["completed","rated"];

    // Cookie helpers — persist across browser restarts (30 days)
    function setPartnerCookie(id, phone, pin) {
      const exp = new Date();
      exp.setDate(exp.getDate() + 30);
      const val = JSON.stringify({ id, phone, pin });
      document.cookie = 'partner_auth=' + encodeURIComponent(val) + '; expires=' + exp.toUTCString() + '; path=/';
      localStorage.setItem('partner_auth', val);
    }
    function getPartnerCookie() {
      try {
        // Try cookie first
        const match = document.cookie.split(';').find(c => c.trim().startsWith('partner_auth='));
        if (match) return JSON.parse(decodeURIComponent(match.split('=')[1]));
        // Fallback to localStorage
        const ls = localStorage.getItem('partner_auth');
        if (ls) return JSON.parse(ls);
      } catch(e) {}
      return null;
    }
    function clearPartnerCookie() {
      document.cookie = 'partner_auth=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/';
      localStorage.removeItem('partner_auth');
    }

    async function checkLogin() {
      const phone = document.getElementById("phoneInput").value.trim();
      const pin = document.getElementById("pinInput").value.trim();
      const errEl = document.getElementById("loginError");
      errEl.classList.add("hidden");

      if (!phone || !pin) {
        errEl.textContent = "Enter phone and PIN.";
        errEl.classList.remove("hidden");
        return;
      }

      const { data, error } = await db
        .from("partners")
        .select("id, name, city, phone, status")
        .eq("phone", phone)
        .eq("pin", pin)
        .maybeSingle();

      if (error || !data) {
        errEl.textContent = "Invalid phone or PIN.";
        errEl.classList.remove("hidden");
        return;
      }

      if (data.status !== "active") {
        errEl.textContent = "Your account is not active. Contact admin.";
        errEl.classList.remove("hidden");
        return;
      }

      currentPartner = data;
      sessionStorage.setItem("partner_id", data.id);
      sessionStorage.setItem("partner_phone", data.phone);
      sessionStorage.setItem("partner_pin", pin);
      sessionStorage.setItem("partner_display_settings", JSON.stringify(data.display_settings || {}));
      if (document.getElementById("rememberMe").checked) {
        setPartnerCookie(data.id, data.phone, pin);
      }
      showDashboard();
    }

    document.getElementById("pinInput").addEventListener("keydown", e => {
      if (e.key === "Enter") checkLogin();
    });

    function showDashboard() {
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("dashboard").classList.remove("hidden");
      document.getElementById("cityBadge").textContent = currentPartner.city;
      document.getElementById("partnerName").textContent = currentPartner.name;
      // Re-enable scroll for dashboard
      document.documentElement.style.overflow = '';
      document.documentElement.style.position = '';
      document.body.style.overflow = '';
      document.body.style.position = '';
      document.body.style.width = '';
      document.body.style.height = '';
      loadOrders();
    }

    function logout() {
      sessionStorage.clear();
      clearPartnerCookie();
      document.getElementById("loginScreen").style.display = "flex";
      document.getElementById("dashboard").classList.add("hidden");
    }

    window.addEventListener("DOMContentLoaded", async () => {
      // Check sessionStorage first, then cookie
      let pid   = sessionStorage.getItem("partner_id");
      let phone = sessionStorage.getItem("partner_phone");
      let pin   = sessionStorage.getItem("partner_pin");

      if (!pid) {
        const saved = getPartnerCookie();
        if (saved) { pid = saved.id; phone = saved.phone; pin = saved.pin; }
      }

      if (pid && pin) {
        const { data } = await db
          .from("partners")
          .select("id, name, city, phone, status, display_settings")
          .eq("id", pid)
          .eq("pin", pin)
          .maybeSingle();
        if (data && data.status === "active") {
          currentPartner = data;
          sessionStorage.setItem("partner_id", data.id);
          sessionStorage.setItem("partner_phone", data.phone);
          sessionStorage.setItem("partner_pin", pin);
          sessionStorage.setItem("partner_display_settings", JSON.stringify(data.display_settings || {}));
          setPartnerCookie(data.id, data.phone, pin); // Refresh cookie expiry
          showDashboard();
        } else {
          sessionStorage.clear();
          clearPartnerCookie();
        }
      }
    });

    async function loadOrders() {
      // Always re-fetch partner settings so admin changes apply immediately
      const { data: freshPartner } = await db
        .from("partners")
        .select("display_settings")
        .eq("id", currentPartner.id)
        .maybeSingle();
      if (freshPartner) {
        currentPartner.display_settings = freshPartner.display_settings;
        sessionStorage.setItem("partner_display_settings", JSON.stringify(freshPartner.display_settings || {}));
      }

      const { data, error } = await db
        .from("bookings")
        .select("*")
        .eq("assigned_partner_id", currentPartner.id)
        .order("assigned_at", { ascending: false });

      if (error) {
        console.error(error);
        document.getElementById("ordersList").innerHTML =
          `<p class="text-center text-red-400 py-10">Could not load orders. Pull to refresh.</p>`;
        return;
      }

      allOrders = data || [];
      renderOrders();
    }

    function setFilter(f) {
      currentFilter = f;
      document.querySelectorAll(".filter-btn").forEach(btn => {
        const active = btn.dataset.filter === f;
        btn.className = `filter-btn px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap border ${
          active ? "bg-black text-white border-black" : "bg-white text-gray-700"
        }`;
      });
      renderOrders();
    }

    function renderOrders() {
      const list = document.getElementById("ordersList");
      let filtered = allOrders;
      if (currentFilter === "active") {
        filtered = allOrders.filter(b => ACTIVE_STATUSES.includes(b.fulfillment_status));
      } else if (currentFilter === "completed") {
        filtered = allOrders.filter(b => COMPLETED_STATUSES.includes(b.fulfillment_status));
      }

      if (filtered.length === 0) {
        list.innerHTML = `<p class="text-center text-gray-400 py-10">No orders here</p>`;
        return;
      }

      list.innerHTML = filtered.map(orderCard).join("");
    }

    function statusLabel(s) {
      return (s || "pending_assignment").replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
    }

    // Helper: get display settings
    function getDS() {
      try { return JSON.parse(sessionStorage.getItem("partner_display_settings") || "{}"); }
      catch(e) { return {}; }
    }

    // Accept order directly from list (no wizard step needed)
    async function acceptOrder(bookingId, event) {
      event.stopPropagation();
      const btn = event.target;
      btn.disabled = true; btn.textContent = 'Accepting...';
      const { error } = await db.from('bookings')
        .update({ fulfillment_status: 'accepted' })
        .eq('id', bookingId);
      if (error) { toast('Failed: ' + error.message); btn.disabled = false; btn.textContent = 'Accept'; return; }
      // Update local state
      const b = allOrders.find(x => x.id === bookingId);
      if (b) b.fulfillment_status = 'accepted';
      renderOrders();
    }

    // Parse booking date+time into Date object
    function parseBookingTime(dateStr, timeStr) {
      if (!dateStr || !timeStr) return null;
      try {
        const dm = dateStr.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
        if (!dm) return null;
        const am = timeStr.trim().match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
        if (!am) return null;
        let h = parseInt(am[1]);
        if (am[3].toUpperCase() === 'PM' && h !== 12) h += 12;
        if (am[3].toUpperCase() === 'AM' && h === 12) h = 0;
        return new Date(parseInt(dm[3]), parseInt(dm[2])-1, parseInt(dm[1]), h, parseInt(am[2]));
      } catch(e) { return null; }
    }

    function getCountdownBadge(b) {
      if (!['accepted','packed_scanned'].includes(b.fulfillment_status)) return '';
      const dt = parseBookingTime(b.booking_date, b.start_time);
      if (!dt) return '';
      const mins = (dt - Date.now()) / 60000;
      if (mins < 0) return '<span style="background:#fee2e2;color:#dc2626;font-weight:700;font-size:11px;padding:3px 8px;border-radius:8px">⚠ Overdue</span>';
      if (mins <= 30) return '<span style="background:#fef3c7;color:#92400e;font-weight:700;font-size:11px;padding:3px 8px;border-radius:8px">⏰ Pack now! ' + Math.round(mins) + 'm left</span>';
      const h = Math.floor(mins/60), m = Math.round(mins%60);
      const label = h > 0 ? h + 'h ' + m + 'm' : m + 'm';
      return '<span style="background:#f0fdf4;color:#15803d;font-size:11px;padding:3px 8px;border-radius:8px">🕐 ' + label + ' until delivery</span>';
    }

    // Refresh countdown every minute
    setInterval(() => { if (document.getElementById('dashboard') && !document.getElementById('dashboard').classList.contains('hidden')) renderOrders(); }, 60000);

    function orderCard(b) {
      const date = new Date(b.assigned_at || b.created_at).toLocaleDateString("en-IN", {
        day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"
      });
      const needsAction = b.fulfillment_status === "assigned";
      const ds = getDS();
      const isCOD = b.payment_method !== 'prepaid';
      const showAmount = isCOD || ds.show_amount !== false;
      const contactMode = ds.contact_mode ?? 'both';

      // Contact buttons
      let contactHtml = '';
      if (contactMode === 'both' || contactMode === 'call') {
        contactHtml += `<a href="tel:${b.phone}" onclick="event.stopPropagation()" class="flex-1 text-center text-xs font-bold bg-gray-100 text-gray-700 py-2 rounded-xl">📞 Call</a>`;
      }
      if (contactMode === 'both' || contactMode === 'whatsapp') {
        contactHtml += `<a href="https://wa.me/91${b.phone}" target="_blank" onclick="event.stopPropagation()" class="flex-1 text-center text-xs font-bold bg-green-100 text-green-700 py-2 rounded-xl">💬 WhatsApp</a>`;
      }

      return `
        <div class="bg-white rounded-2xl shadow-sm p-3 ${needsAction ? 'ring-2 ring-yellow-400' : ''}"
             onclick="openOrder(${b.id})">

          <!-- Header -->
          <div class="flex justify-between items-start mb-2">
            <div>
              <p class="font-bold text-gray-900 text-base leading-tight">${b.customer_name || "Customer"}</p>
              <p class="text-gray-400 text-xs">${date}</p>
            </div>
            <span class="status-${b.fulfillment_status || 'pending_assignment'} text-xs font-bold px-2 py-0.5 rounded-full">${statusLabel(b.fulfillment_status)}</span>
          </div>

          <!-- Compact grid: plan+date / amount -->
          <div class="grid grid-cols-3 gap-1.5 mb-2 text-xs">
            ${(ds.show_plan_time !== false) ? `
            <div class="bg-gray-50 rounded-lg p-1.5 col-span-1">
              <p class="text-gray-400">Plan</p>
              <p class="font-semibold capitalize">${b.plan || '—'}</p>
              <p class="text-gray-400" style="font-size:10px">${b.start_time || ''} – ${b.end_time || ''}</p>
            </div>` : ''}
            ${(ds.show_date !== false) ? `
            <div class="bg-gray-50 rounded-lg p-1.5 col-span-1">
              <p class="text-gray-400">Date</p>
              <p class="font-semibold">${b.booking_date || '—'}</p>
            </div>` : ''}
            ${showAmount ? `
            <div class="bg-gray-50 rounded-lg p-1.5 col-span-1">
              <p class="text-gray-400">Amount</p>
              <p class="font-bold text-green-700">₹${b.total_amount || 0}</p>
              <p style="color:${isCOD?'#2563eb':'#16a34a'};font-size:10px;font-weight:700">${isCOD ? 'COD · Adv ₹' + Math.round((b.total_amount||0)*0.10) : 'Prepaid ✅'}</p>
            </div>` : ''}
          </div>

          <!-- Games -->
          ${(ds.show_games !== false && b.games) ? `
          <div class="bg-gray-50 rounded-xl p-2 text-xs mb-2">
            <p class="text-gray-400 mb-0.5">Games & Controllers</p>
            <p class="font-medium">${b.games}</p>
            <p class="text-gray-500 mt-0.5">🕹 ${b.controllers_count || 1} Controller${(b.controllers_count||1)>1?'s':''}</p>
          </div>` : ''}

          <!-- Address -->
          <div class="bg-gray-50 rounded-xl p-2 text-xs mb-2">
            <p class="text-gray-400 mb-0.5">Address</p>
            <p class="font-medium">${b.address || '—'}</p>
          </div>

          <!-- Countdown badge -->
          ${getCountdownBadge(b)}

          <!-- Action row -->
          <div class="flex gap-2 mt-2 items-center">
            ${b.fulfillment_status === 'assigned'
              ? `<button onclick="acceptOrder(${b.id}, event)"
                  class="flex-1 text-xs font-bold py-2.5 rounded-xl text-black bg-yellow-400 border-b-2 border-yellow-600">
                  ✅ Accept Order
                 </button>`
              : `<button onclick="event.stopPropagation(); openOrder(${b.id})"
                  class="flex-1 text-xs font-bold py-2 rounded-xl text-white bg-black">
                  ▶ Open Order
                 </button>`
            }
            ${contactMode !== 'none' ? `
              ${(contactMode === 'both' || contactMode === 'call') ? `<a href="tel:${b.phone}" onclick="event.stopPropagation()" title="Call" class="flex items-center justify-center w-9 h-9 rounded-xl bg-gray-100 text-gray-700 text-base">📞</a>` : ''}
              ${(contactMode === 'both' || contactMode === 'whatsapp') ? `<a href="https://wa.me/91${b.phone}" target="_blank" onclick="event.stopPropagation()" title="WhatsApp" class="flex items-center justify-center w-9 h-9 rounded-xl bg-green-100 text-green-700 text-base">💬</a>` : ''}
            ` : ''}
          </div>
          <p class="text-gray-400 text-xs mt-1.5">Ref: ${b.reference_number || b.id}</p>
        </div>`;
    }

    function openOrder(bookingId) {
      location.href = `partner-wizard.html?booking_id=${bookingId}`;
    }

    // Refresh orders when returning from wizard via back button (bfcache restore)
    window.addEventListener('pageshow', function(e) {
      if (e.persisted && currentPartner) {
        loadOrders();
      }
    });

    // Register service worker for PWA install
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
</script>
</body>
</html>
